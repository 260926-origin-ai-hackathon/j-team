<style>
  :root {
    --bg: #EDF3F8;
    --surface: #ffffff;
    --surface-2: #F5F9FC;
    --ink: #17283A;
    --muted: #566677;
    --line: #D3DFE9;
    --accent: #2A7AB8;
    --accent-soft: #E3F4FC;
    --on-accent: #ffffff;
    --mark: #f5d547;
    --good: #2f8a52;
    --warn: #c47a16;
    --bad: #bf3f2c;
    --map-ground: #F6FAFD;
    --map-road: #C5D1DB;
    --map-rail: #6B7985;
    --flood-1: #8ec3ee;
    --flood-2: #3f8fd6;
    --flood-3: #1f5fa8;
    --display: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
    --body: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0F161D; --surface: #16212B; --surface-2: #1C2834; --ink: #E2ECF4; --muted: #96A6B5;
      --line: #2A3947; --accent: #6BBEEA; --accent-soft: #15344A; --on-accent: #0A1822; --mark: #cdb03a;
      --good: #58c083; --warn: #e0a044; --bad: #ef7461;
      --map-ground: #121B23; --map-road: #33424F; --map-rail: #8B9AA7;
      --flood-1: #2d5f8c; --flood-2: #3f86c9; --flood-3: #7fb6ea;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0F161D; --surface: #16212B; --surface-2: #1C2834; --ink: #E2ECF4; --muted: #96A6B5;
    --line: #2A3947; --accent: #6BBEEA; --accent-soft: #15344A; --on-accent: #0A1822; --mark: #cdb03a;
    --good: #58c083; --warn: #e0a044; --bad: #ef7461;
    --map-ground: #121B23; --map-road: #33424F; --map-rail: #8B9AA7;
    --flood-1: #2d5f8c; --flood-2: #3f86c9; --flood-3: #7fb6ea;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--body);
    font-size: 15px; line-height: 1.65; overflow: hidden; margin: 0; padding-inline: 16px; padding-block: 0;
  }
  h1, h2, h3 { font-family: var(--display); line-height: 1.3; text-wrap: balance; margin: 0; }
  p { margin: 0; }
  .num { font-variant-numeric: tabular-nums; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }

  /* ---- 枠 ---- */
  .app { height: 100%; max-width: 1400px; margin: 0 auto; display: grid; grid-template-rows: auto minmax(0, 1fr); padding-bottom: 14px; }
  header.top { display: flex; align-items: center; gap: 12px; padding-block: 10px; min-width: 0; }
  .logo { font-family: var(--display); font-weight: 900; font-size: 21px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .logo[hidden] { display: none; }
  .tagline { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .spacer { flex: 1; }
  .chip-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .chip-btn b { font-family: var(--display); color: var(--accent); }
  .ai-state { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .ai-state.on { color: var(--accent); border-color: var(--accent); }
  @media (max-width: 720px) { .tagline, .ai-state { display: none; } }

  .stage { position: relative; min-height: 0; }
  .screen { position: absolute; inset: 0; min-height: 0; }
  .screen[hidden] { display: none !important; }
  @media (prefers-reduced-motion: no-preference) {
    .screen { animation: in .25s ease both; }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  }

  .btn { border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); font-weight: 700; border-radius: 10px; padding: 9px 18px; cursor: pointer; white-space: nowrap; }
  .btn.ghost { background: transparent; color: var(--accent); }
  .btn:disabled { opacity: .55; cursor: progress; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; min-height: 0; }
  .eyebrow { font-size: 12px; letter-spacing: .08em; color: var(--muted); font-weight: 700; margin-bottom: 4px; }

  /* ---- 地図の画面 ---- */
  /* 最初の画面（キャラクター）。キャラと、この画面だけ水色 */
  :root { --sky: #3F9FD8; --sky-deep: #1E5F8A; --sky-soft: #E3F4FC; }
  .s-start { display: grid; place-items: center; overflow: hidden; border-radius: 18px; background: var(--sky-soft); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --sky-soft: #14303f; } }
  :root[data-theme="dark"] { --sky-soft: #14303f; }
  .mascot-wrap { display: grid; place-items: center; }
  .start-char { display: grid; justify-items: center; gap: 10px; border: none; background: none; padding: 16px 24px; border-radius: 28px; cursor: pointer; color: var(--sky-deep); }
  .start-char:hover .mascot { transform: scale(1.03); }
  .start-char .mascot { transition: transform .2s ease; }
  .start-title { font-family: var(--display); font-weight: 900; font-size: clamp(40px, 6vw, 64px); line-height: 1.1; letter-spacing: .06em; color: var(--sky-deep); margin-top: -6px; }
  .start-hint { font-family: var(--display); font-weight: 700; font-size: 16px; letter-spacing: .08em; padding: 6px 18px; border-radius: 999px; background: var(--surface); border: 2px solid var(--sky); }
  .bubble { position: relative; background: var(--surface); border: 2px solid var(--sky); border-radius: 18px; padding: 16px 20px; color: var(--ink); }
  .bubble p { margin: 0; line-height: 1.75; }
  .map-guide { position: absolute; right: 12px; bottom: 84px; z-index: 690; display: flex; align-items: flex-end; gap: 6px; pointer-events: none; max-width: min(340px, calc(100% - 24px)); }
  .map-guide .mascot { flex: none; filter: drop-shadow(0 2px 4px rgba(0,0,0,.12)); }
  .map-bubble { position: relative; padding: 8px 14px; border-radius: 14px; font-size: 13px; font-weight: 700; line-height: 1.5; margin-bottom: 22px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
  .map-bubble::after { content: ""; position: absolute; right: -8px; bottom: 16px; width: 12px; height: 12px; background: var(--surface); border-right: 2px solid var(--sky); border-top: 2px solid var(--sky); transform: rotate(45deg); }
  @media (max-width: 860px) { .map-guide { display: none; } }
  /* ひとことの長さでヘヤまるの位置や見出しの高さが変わらないよう、吹き出しの大きさを固定する */
  .d-guide { display: flex; align-items: center; gap: 8px; flex: 0 0 420px; width: 420px; }
  @media (max-width: 1200px) { .d-guide { flex-basis: 320px; width: 320px; } }
  .d-guide .mascot { flex: none; }
  .d-bubble { position: relative; flex: 1; min-width: 0; height: calc(2 * 1.5em + 18px); box-sizing: border-box; display: flex; align-items: center; padding: 8px 14px; border-radius: 14px; font-size: 13.5px; font-weight: 700; line-height: 1.5; color: var(--ink); }
  .d-bubble > span { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .d-bubble::before { content: ""; position: absolute; left: -8px; top: 50%; width: 12px; height: 12px; margin-top: -6px; background: var(--surface); border-left: 2px solid var(--sky); border-bottom: 2px solid var(--sky); transform: rotate(45deg); }
  .d-head .d-guide + .pv-price { margin-left: 0; }
  .guide { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; }
  .small-bubble { padding: 8px 12px; border-radius: 14px; }
  .small-bubble h2 { font-size: 17px; }
  .small-bubble .eyebrow { color: var(--sky-deep); }
  @media (prefers-reduced-motion: no-preference) {
    .mascot.hop { animation: hop .35s ease-out; transform-origin: 50% 90%; }
    @keyframes hop { 0% { transform: scale(.85) translateY(4px); } 60% { transform: scale(1.06); } 100% { transform: none; } }
    .start-hint { animation: hint 2.8s ease-in-out infinite; }
    @keyframes hint { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
    .mascot.start .mascot-body { animation: bob 2.8s ease-in-out infinite; transform-origin: 100px 200px; }
    .mascot .mascot-eyes { animation: blink 5s infinite; transform-origin: 100px 124px; }
    .mascot.start .mascot-arm { animation: wave 2.8s ease-in-out infinite; transform-origin: 160px 150px; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
    @keyframes wave { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-6deg); } }
  }
  .s-map { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 14px; }
  .mapwrap { position: relative; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--map-ground); min-height: 0; }
  .map { position: absolute; inset: 0; }
  .taskbar { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 700; display: flex; gap: 4px; padding: 5px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 4px 16px rgba(0,0,0,.14); }
  .tb { display: grid; grid-template-columns: auto auto; grid-template-rows: auto auto; column-gap: 8px; align-items: center; text-align: left; border: none; background: none; border-radius: 12px; padding: 6px 12px 6px 10px; cursor: pointer; color: var(--ink); min-width: 0; }
  .tb svg { grid-row: 1 / 3; }
  .tb-label { font-weight: 700; font-size: 13.5px; white-space: nowrap; }
  .tb-sub { font-size: 11px; color: var(--muted); white-space: nowrap; max-width: 9em; overflow: hidden; text-overflow: ellipsis; }
  .tb:hover { background: var(--surface-2); }
  .tb[aria-expanded="true"] { background: var(--accent-soft); color: var(--accent); }
  .sheet { position: absolute; left: 50%; bottom: 76px; transform: translateX(-50%); z-index: 720; width: min(560px, calc(100% - 20px)); max-height: calc(100% - 100px); overflow: auto; display: grid; gap: 10px; padding: 14px 16px; box-shadow: 0 10px 30px rgba(0,0,0,.18); }
  .sheet[hidden] { display: none; }

        <div class="r3d-box" id="room3dBox" hidden><div class="r3d-room" id="r3dRoom"></div><div class="r3d-msg" id="r3dMsg"></div></div></div>
      <div class="d-body">
        <div class="tabs" role="tablist" id="tabs"></div>
        <div class="tabbody" id="tabBody"></div>
      </div>
    </section>
  </main>
</div>

<script>
/*
 * 部屋の中を3Dで見る（Room3D）
 *
 * kurashi-ai（https://github.com/daichi05xxx-commits/kurashi-ai）の
 * src/lib/layouts.ts（間取りテンプレートと組み立て・当たり判定）と
 * src/components/Walkthrough3D.tsx（three.js の部屋・光・操作）を、
 * ヘヤカルテ用にビルドなしの JavaScript へ移植したもの。周辺の道路・騒音地図・家具の配置は移植していない。
 *
 * 3Dモデルは間取り図から読み取ったものではなく、間取りタイプ＋面積から組み立てた簡易モデル。
 */
(() => {
  "use strict";
  const THREE_URL = "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.min.js";

  /* ---------------- 間取り（kurashi-ai の layouts.ts から） ---------------- */
  const door = (from, to) => ({ from, to, kind: "door" });
  const TEMPLATES = {
    // 1R・1K・1DK（ヘヤカルテの物件にある間取り）だけを取り込んでいる
    "1R": {
    width: 4,
    depth: 5.5,
    rooms: [
      { name: "浴室・トイレ", kind: "bath", x: 0, z: 0, w: 1.6, d: 1.8 },
      { name: "玄関・キッチン", kind: "kitchen", x: 1.6, z: 0, w: 2.4, d: 1.8 },
      { name: "洋室", kind: "living", x: 0, z: 1.8, w: 4, d: 3.7 },
    ],
    innerWalls: [
      { x1: 1.6, z1: 0, x2: 1.6, z2: 1.8, openings: [door(0.6, 1.3)] },
      { x1: 0, z1: 1.8, x2: 1.6, z2: 1.8, openings: [] },
    ],
    outerOpenings: [
      { side: "top", from: 3.0, to: 3.8, kind: "entrance" },
      { side: "bottom", from: 0.8, to: 3.2, kind: "window" },
    ],
    furniture: [
      { kind: "tub", x: 0.8, z: 0.45, w: 1.4, d: 0.7 },
      { kind: "counter", x: 2.3, z: 0.3, w: 1.2, d: 0.6 },
      { kind: "washer", x: 3.65, z: 1.4, w: 0.6, d: 0.6 },
      { kind: "bed", x: 0.6, z: 4.4, w: 1.0, d: 2.0 },
      { kind: "desk", x: 3.65, z: 2.9, w: 0.5, d: 1.0 },
      { kind: "lowtable", x: 2.3, z: 3.9, w: 0.8, d: 0.6 },
    ],
  },
  "1K": {
    width: 4,
    depth: 6.5,
    rooms: [
      { name: "浴室・洗面", kind: "bath", x: 0, z: 0, w: 1.6, d: 2.2 },
      { name: "キッチン", kind: "kitchen", x: 1.6, z: 0, w: 2.4, d: 2.2 },
      { name: "洋室", kind: "living", x: 0, z: 2.2, w: 4, d: 4.3 },
    ],
    innerWalls: [
      { x1: 1.6, z1: 0, x2: 1.6, z2: 2.2, openings: [door(0.7, 1.4)] },
      { x1: 0, z1: 2.2, x2: 4, z2: 2.2, openings: [door(2.6, 3.4)] },
    ],
    outerOpenings: [
      { side: "top", from: 3.0, to: 3.8, kind: "entrance" },
      { side: "bottom", from: 0.6, to: 3.4, kind: "window" },
    ],
    furniture: [
      { kind: "tub", x: 0.8, z: 0.45, w: 1.4, d: 0.7 },
      { kind: "washer", x: 0.4, z: 1.8, w: 0.6, d: 0.6 },
      { kind: "counter", x: 2.25, z: 0.3, w: 1.1, d: 0.6 },
      { kind: "closet", x: 0.7, z: 2.5, w: 1.2, d: 0.6 },
      { kind: "bed", x: 0.6, z: 5.4, w: 1.0, d: 2.0 },
      { kind: "desk", x: 3.65, z: 3.4, w: 0.5, d: 1.0 },
      { kind: "lowtable", x: 2.4, z: 4.6, w: 0.8, d: 0.6 },
    ],
  },
  "1DK": {
    width: 5.5,
    depth: 6.5,
    rooms: [
      { name: "浴室・洗面", kind: "bath", x: 0, z: 0, w: 1.8, d: 3.0 },
      { name: "ダイニングキッチン", kind: "kitchen", x: 1.8, z: 0, w: 3.7, d: 3.0 },
      { name: "洋室", kind: "living", x: 0, z: 3.0, w: 5.5, d: 3.5 },
    ],
    innerWalls: [
      { x1: 1.8, z1: 0, x2: 1.8, z2: 3.0, openings: [door(1.2, 2.0)] },
      { x1: 0, z1: 3.0, x2: 5.5, z2: 3.0, openings: [door(3.4, 4.2)] },
    ],
    outerOpenings: [
      { side: "top", from: 4.3, to: 5.1, kind: "entrance" },
      { side: "bottom", from: 0.8, to: 4.8, kind: "window" },
    ],
    furniture: [
      { kind: "tub", x: 0.9, z: 0.45, w: 1.4, d: 0.7 },
      { kind: "washer", x: 0.45, z: 2.5, w: 0.6, d: 0.6 },
      { kind: "counter", x: 2.9, z: 0.3, w: 2.0, d: 0.6 },
      { kind: "table", x: 3.2, z: 1.9, w: 0.9, d: 0.9 },
      { kind: "closet", x: 0.8, z: 3.3, w: 1.6, d: 0.6 },
      { kind: "bed", x: 0.6, z: 5.4, w: 1.0, d: 2.0 },
      { kind: "desk", x: 5.2, z: 4.3, w: 0.5, d: 1.0 },
      { kind: "lowtable", x: 3.0, z: 5.0, w: 0.8, d: 0.6 },
    ],
  },
  };

  function buildLayout(type, area) {
    const tpl = TEMPLATES[type] ?? TEMPLATES["1K"];
    const scale = Math.min(1.35, Math.max(0.8, Math.sqrt((area || tpl.width * tpl.depth) / (tpl.width * tpl.depth))));
    const s = (n) => Math.round(n * scale * 100) / 100;
    const W = s(tpl.width), D = s(tpl.depth);
    const outer = (side) => {
      const openings = tpl.outerOpenings.filter((o) => o.side === side).map((o) => ({ from: s(o.from), to: s(o.to), kind: o.kind }));
      return {
        top: { x1: 0, z1: 0, x2: W, z2: 0, outer: true, openings },
        bottom: { x1: 0, z1: D, x2: W, z2: D, outer: true, openings },
        left: { x1: 0, z1: 0, x2: 0, z2: D, outer: true, openings },
        right: { x1: W, z1: 0, x2: W, z2: D, outer: true, openings },
      }[side];
    };
    return {
      type: type in TEMPLATES ? type : "1K", width: W, depth: D,
      rooms: tpl.rooms.map((r) => ({ ...r, x: s(r.x), z: s(r.z), w: s(r.w), d: s(r.d) })),
      walls: [outer("top"), outer("bottom"), outer("left"), outer("right"),
        ...tpl.innerWalls.map((w) => ({ x1: s(w.x1), z1: s(w.z1), x2: s(w.x2), z2: s(w.z2), openings: w.openings.map((o) => ({ ...o, from: s(o.from), to: s(o.to) })) }))],
      // 家具は実物のサイズのまま、位置だけ拡大縮小する
      furniture: tpl.furniture.map((f) => ({ ...f, x: s(f.x), z: s(f.z) })),
    };
  }

  /** 壁を「開口部で区切られた区間」に分割する */
  function splitWall(wall) {
    const horizontal = wall.z1 === wall.z2;
    const start = horizontal ? Math.min(wall.x1, wall.x2) : Math.min(wall.z1, wall.z2);
    const end = horizontal ? Math.max(wall.x1, wall.x2) : Math.max(wall.z1, wall.z2);
    const parts = [];
    let cursor = start;
    for (const o of [...wall.openings].sort((a, b) => a.from - b.from)) {
      if (o.from > cursor) parts.push({ from: cursor, to: o.from, opening: null });
      parts.push({ from: o.from, to: o.to, opening: o });
      cursor = o.to;
    }
    if (cursor < end) parts.push({ from: cursor, to: end, opening: null });
    return parts;
  }
  const wallThickness = (wall) => (wall.outer ? 0.18 : 0.12);

  /** 通り抜けられない部分（壁・窓・閉じた玄関ドア）の当たり判定用の矩形 */
  function wallColliders(layout) {
    const boxes = [];
    for (const wall of layout.walls) {
      const horizontal = wall.z1 === wall.z2, T = wallThickness(wall), fixed = horizontal ? wall.z1 : wall.x1;
      const parts = splitWall(wall), start = parts[0]?.from ?? 0, end = parts[parts.length - 1]?.to ?? 0;
      for (const part of parts) {
        if (part.opening?.kind === "door") continue;
        const from = part.from === start ? part.from - T / 2 : part.from;
        const to = part.to === end ? part.to + T / 2 : part.to;
        boxes.push(horizontal ? { x1: from, x2: to, z1: fixed - T / 2, z2: fixed + T / 2 } : { x1: fixed - T / 2, x2: fixed + T / 2, z1: from, z2: to });
      }
    }
    return boxes;
  }
  const tatami = (room) => (room.w * room.d / 1.62).toFixed(1);

  /* ---------------- 3D（kurashi-ai の Walkthrough3D.tsx から） ---------------- */
  const WALL_H = 2.4, STORY_H = 2.9, EYE = 1.5, RADIUS = 0.22, SPEED = 1.6, DOOR_TOP = 2.05, SILL = 0.85;
  const SUN = {
    南: { fromWindow: true, elevation: 40, intensity: 2.4, color: 0xfff1dc, label: "南向き：日中を通して窓から日差しが入ります（正午ごろのイメージ）" },
    東: { fromWindow: true, elevation: 18, intensity: 1.8, color: 0xfff4e2, label: "東向き：朝に低い角度の日差しが入ります（朝8時ごろのイメージ）" },
    西: { fromWindow: true, elevation: 14, intensity: 2.0, color: 0xffc98f, label: "西向き：夕方に強い西日が入ります（夕方4時ごろのイメージ）" },
    北: { fromWindow: false, elevation: 45, intensity: 1.4, color: 0xf2f5ff, label: "北向き：直射日光はほぼ入らず、やわらかい光になります" },
  };
  const ROOM_COLORS = { living: "rgba(199,165,118,.6)", bed: "rgba(146,178,150,.6)", kitchen: "rgba(230,190,120,.55)", bath: "rgba(120,175,196,.6)", hall: "rgba(180,172,150,.5)" };

  let threePromise = null;
  const loadThree = () => (threePromise ??= import(THREE_URL));

  /**
   * container に3Dの部屋を描く。
   * opts: { type, area, floor, facing, balcony, minimap（間取り図を描く canvas）, onRoom(name), onMode(mode) }
   * 戻り値の Promise は { setMode, teleport, dispose, sunLabel, layout } を返す
   */
  async function open(container, opts) {
    const THREE = await loadThree();
    const layout = buildLayout(opts.type, opts.area);
    const W = layout.width, D = layout.depth;
    const baseY = (Math.max(1, opts.floor || 1) - 1) * STORY_H, houseY = baseY + 0.06;

    const canvas = document.createElement("canvas");
    canvas.className = "r3d-canvas";
    container.prepend(canvas);
    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    } catch (err) {
      canvas.remove();
      throw new Error("webgl");
    }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xcfe3f2);
    scene.fog = new THREE.Fog(0xcfe3f2, 60, 220);
    const camera = new THREE.PerspectiveCamera(65, 1, 0.05, 600);
    camera.rotation.order = "YXZ";

    // 光（窓の向きで日差しの角度・強さ・色を変える）
    scene.add(new THREE.HemisphereLight(0xffffff, 0x9a8a78, 1.9));
    const sunCfg = SUN[opts.facing] ?? SUN["南"];
    const sun = new THREE.DirectionalLight(sunCfg.color, sunCfg.intensity);
    const elev = (sunCfg.elevation * Math.PI) / 180, dist = 60;
    sun.position.set(W / 2 + 8, houseY + Math.sin(elev) * dist, sunCfg.fromWindow ? D / 2 + Math.cos(elev) * dist : D / 2 - Math.cos(elev) * dist);
    sun.target.position.set(W / 2, houseY, D / 2);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    const ext = Math.max(W, D) / 2 + 8;
    Object.assign(sun.shadow.camera, { left: -ext, right: ext, top: ext, bottom: -ext, near: 1, far: 160 });
    sun.shadow.bias = -0.0004;
    scene.add(sun, sun.target);

    const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: 0xb9c4ab, roughness: 1 }));
    ground.rotation.x = -Math.PI / 2;
    ground.position.set(W / 2, 0, D / 2);
    ground.receiveShadow = true;
    scene.add(ground);

    const house = new THREE.Group();
    house.position.y = houseY;
    scene.add(house);
    if (baseY > 0) { // 下の階（外観のボリュームだけ）
      const lower = new THREE.Mesh(new THREE.BoxGeometry(W + 0.3, baseY + 0.06, D + 0.3), new THREE.MeshStandardMaterial({ color: 0xd8d2c6, roughness: 0.95 }));
      lower.position.set(W / 2, (baseY + 0.06) / 2, D / 2);
      lower.castShadow = lower.receiveShadow = true;
      scene.add(lower);
    }
    for (const r of layout.rooms) {
      const l = new THREE.PointLight(0xffe2b8, r.kind === "bath" || r.kind === "hall" ? 2.5 : 4.5, 7, 2);
      l.position.set(r.x + r.w / 2, WALL_H - 0.25, r.z + r.d / 2);
      house.add(l);
    }
    const woodTex = makeWoodTexture(THREE), tileTex = makeTileTexture(THREE);
    for (const r of layout.rooms) {
      const tex = (r.kind === "bath" ? tileTex : woodTex).clone();
      tex.repeat.set(r.w / (r.kind === "bath" ? 0.6 : 1.2), r.d / (r.kind === "bath" ? 0.6 : 1.2));
      tex.needsUpdate = true;
      const tint = { living: 0xffffff, bed: 0xf2eee6, kitchen: 0xf6efe2, bath: 0xffffff, hall: 0xe9e2d6 }[r.kind];
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(r.w, r.d), new THREE.MeshStandardMaterial({ map: tex, color: tint, roughness: 0.75 }));
      floor.rotation.x = -Math.PI / 2;
      floor.position.set(r.x + r.w / 2, 0, r.z + r.d / 2);
      floor.receiveShadow = true;
      house.add(floor);
    }
    if (opts.balcony) {
      const balcony = new THREE.Mesh(new THREE.BoxGeometry(W, 0.1, 1.2), new THREE.MeshStandardMaterial({ color: 0xb9b6ae, roughness: 1 }));
      balcony.position.set(W / 2, -0.05, D + 0.7);
      balcony.receiveShadow = balcony.castShadow = true;
      house.add(balcony);
      const rail = new THREE.Mesh(new THREE.BoxGeometry(W, 1.0, 0.05), new THREE.MeshStandardMaterial({ color: 0x8e9499, transparent: true, opacity: 0.55 }));
      rail.position.set(W / 2, 0.5, D + 1.28);
      house.add(rail);
    }
    const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(W, D), new THREE.MeshStandardMaterial({ color: 0xf7f5f0, roughness: 1 }));
    ceiling.rotation.x = Math.PI / 2;
    ceiling.position.set(W / 2, WALL_H, D / 2);
    house.add(ceiling);

    const wallGroup = new THREE.Group();
    house.add(wallGroup);
    const wallMat = new THREE.MeshStandardMaterial({ color: 0xf1ede5, roughness: 0.95 });
    const frameMat = new THREE.MeshStandardMaterial({ color: 0xdcd6cb, roughness: 0.9 });
    const glassMat = new THREE.MeshStandardMaterial({ color: 0xcfe8f7, transparent: true, opacity: 0.18, roughness: 0.05 });
    const doorMat = new THREE.MeshStandardMaterial({ color: 0x6f5a45, roughness: 0.7 });
    for (const wall of layout.walls) {
      const horizontal = wall.z1 === wall.z2, T = wallThickness(wall), fixed = horizontal ? wall.z1 : wall.x1;
      const parts = splitWall(wall), start = parts[0]?.from ?? 0, end = parts[parts.length - 1]?.to ?? 0;
      const addBox = (from, to, y0, y1, mat, thickness = T, cast = true) => {
        const len = to - from;
        const geo = horizontal ? new THREE.BoxGeometry(len, y1 - y0, thickness) : new THREE.BoxGeometry(thickness, y1 - y0, len);
        const mesh = new THREE.Mesh(geo, mat);
        const mid = (from + to) / 2;
        mesh.position.set(horizontal ? mid : fixed, (y0 + y1) / 2, horizontal ? fixed : mid);
        mesh.castShadow = cast;
        mesh.receiveShadow = true;
        wallGroup.add(mesh);
      };
      for (const part of parts) {
        const from = part.from === start ? part.from - T / 2 : part.from;
        const to = part.to === end ? part.to + T / 2 : part.to;
        if (!part.opening) addBox(from, to, 0, WALL_H, wallMat);
        else if (part.opening.kind === "window") {
          addBox(part.from, part.to, 0, SILL, wallMat);
          addBox(part.from, part.to, DOOR_TOP, WALL_H, wallMat);
          addBox(part.from, part.to, SILL - 0.03, SILL, frameMat, T + 0.04);
          addBox(part.from, part.to, SILL, DOOR_TOP, glassMat, 0.02, false);
        } else {
          addBox(part.from, part.to, DOOR_TOP, WALL_H, wallMat);
          if (part.opening.kind === "entrance") addBox(part.from, part.to, 0, DOOR_TOP, doorMat, 0.05);
        }
      }
    }
    const colliders = wallColliders(layout);
    const furniture = new THREE.Group();
    for (const f of layout.furniture) addFurniture(THREE, furniture, f);
    house.add(furniture);

    // 状態
    const livingRooms = layout.rooms.filter((r) => r.kind === "living");
    const startRoom = [...livingRooms].sort((a, b) => b.w * b.d - a.w * a.d)[0] ?? layout.rooms[0];
    const player = { x: startRoom.x + startRoom.w / 2, z: startRoom.z + startRoom.d * 0.3, yaw: Math.PI, pitch: -0.12 };
    const orbit = { yaw: 0.35, pitch: 0.95, radius: Math.max(W, D) * 1.6 };
    let mode = "walk", target = null, lastRoom = "", disposed = false;
    const keys = {};

    const marker = new THREE.Mesh(new THREE.RingGeometry(0.14, 0.2, 32), new THREE.MeshBasicMaterial({ color: 0xd9822f, transparent: true, opacity: 0.9, depthWrite: false }));
    marker.rotation.x = -Math.PI / 2;
    marker.visible = false;
    house.add(marker);

    const collides = (x, z) => colliders.some((b) => x + RADIUS > b.x1 && x - RADIUS < b.x2 && z + RADIUS > b.z1 && z - RADIUS < b.z2);
    const inside = (x, z) => x > RADIUS && x < W - RADIUS && z > RADIUS && z < D - RADIUS;
    const roomAt = (x, z) => layout.rooms.find((r) => x >= r.x && x <= r.x + r.w && z >= r.z && z <= r.z + r.d) ?? null;
    function tryMove(dx, dz) {
      let moved = false;
      const nx = player.x + dx;
      if (inside(nx, player.z) && !collides(nx, player.z)) { player.x = nx; moved ||= Math.abs(dx) > 1e-5; }
      const nz = player.z + dz;
      if (inside(player.x, nz) && !collides(player.x, nz)) { player.z = nz; moved ||= Math.abs(dz) > 1e-5; }
      return moved;
    }
    function freeSpot(x, z) {
      if (inside(x, z) && !collides(x, z)) return { x, z };
      for (let r = 0.1; r < 1.5; r += 0.1) for (let a = 0; a < Math.PI * 2; a += Math.PI / 8) {
        const px = x + Math.cos(a) * r, pz = z + Math.sin(a) * r;
        if (inside(px, pz) && !collides(px, pz)) return { x: px, z: pz };
      }
      return { x: startRoom.x + startRoom.w / 2, z: startRoom.z + startRoom.d / 2 };
    }
    function applyMode(m) {
      mode = m;
      ceiling.visible = m === "walk";
      wallGroup.scale.y = m === "walk" ? 1 : 0.55;
      target = null;
      marker.visible = false;
      opts.onMode?.(m);
    }
    function enterWalkAt(x, z) {
      const spot = freeSpot(x, z);
      player.x = spot.x; player.z = spot.z; player.pitch = -0.12;
      applyMode("walk");
    }

    // 入力：ドラッグで見まわす／床をクリックで歩く／ホイールで前後
    const raycaster = new THREE.Raycaster();
    const floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -houseY);
    let dragging = false, dragDist = 0, lastX = 0, lastY = 0;
    const floorHit = (e) => {
      const rect = canvas.getBoundingClientRect();
      raycaster.setFromCamera(new THREE.Vector2(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1), camera);
      const hit = new THREE.Vector3();
      return raycaster.ray.intersectPlane(floorPlane, hit) ? { x: hit.x, z: hit.z } : null;
    };
    const onDown = (e) => { dragging = true; dragDist = 0; lastX = e.clientX; lastY = e.clientY; canvas.setPointerCapture?.(e.pointerId); opts.onInteract?.(); };
    const onMove = (e) => {
      if (!dragging) return;
      const dx = e.clientX - lastX, dy = e.clientY - lastY;
      lastX = e.clientX; lastY = e.clientY;
      dragDist += Math.abs(dx) + Math.abs(dy);
      if (mode === "walk") { player.yaw -= dx * 0.005; player.pitch = Math.max(-1.1, Math.min(1.1, player.pitch - dy * 0.005)); }
      else { orbit.yaw -= dx * 0.006; orbit.pitch = Math.max(0.2, Math.min(1.45, orbit.pitch - dy * 0.005)); }
    };
    const onUp = (e) => {
      if (!dragging) return;
      dragging = false;
      if (dragDist > 6) return;
      const hit = floorHit(e);
      if (!hit || !roomAt(hit.x, hit.z)) return;
      if (mode === "dollhouse") enterWalkAt(hit.x, hit.z);
      else { target = hit; marker.position.set(hit.x, 0.02, hit.z); marker.visible = true; }
    };
    const onCancel = () => { dragging = false; };
    const onWheel = (e) => {
      e.preventDefault();
      if (mode === "dollhouse") orbit.radius = Math.max(4, Math.min(40, orbit.radius * (1 + e.deltaY * 0.001)));
      else { const step = -Math.sign(e.deltaY) * 0.25; tryMove(-Math.sin(player.yaw) * step, -Math.cos(player.yaw) * step); }
    };
    canvas.addEventListener("pointerdown", onDown);
    canvas.addEventListener("pointermove", onMove);
    canvas.addEventListener("pointerup", onUp);
    canvas.addEventListener("pointercancel", onCancel);
    canvas.addEventListener("wheel", onWheel, { passive: false });
    const onKeyDown = (e) => {
      const el = e.target;
      if (el && ["INPUT", "TEXTAREA", "SELECT"].includes(el.tagName)) return;
      const k = e.key.toLowerCase();
      if (!["w", "a", "s", "d", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) return;
      keys[k] = true;
      e.preventDefault();
      opts.onInteract?.();
    };
    const onKeyUp = (e) => { keys[e.key.toLowerCase()] = false; };
    const onBlur = () => Object.keys(keys).forEach((k) => (keys[k] = false));
    window.addEventListener("keydown", onKeyDown);
    window.addEventListener("keyup", onKeyUp);
    window.addEventListener("blur", onBlur);

    // 画面左下のスティック（スマホ用）
    const joy = { active: false, x: 0, y: 0, id: -1 };
    const joyEl = document.createElement("div"), nub = document.createElement("div");
    joyEl.className = "r3d-joy"; nub.className = "r3d-nub";
    joyEl.setAttribute("role", "application"); joyEl.setAttribute("aria-label", "移動スティック");
    joyEl.append(nub);
    container.append(joyEl);
    const JOY_R = 32;
    const updateJoy = (e) => {
      const rect = joyEl.getBoundingClientRect();
      let dx = e.clientX - (rect.left + rect.width / 2), dy = e.clientY - (rect.top + rect.height / 2);
      const len = Math.hypot(dx, dy);
      if (len > JOY_R) { dx = (dx / len) * JOY_R; dy = (dy / len) * JOY_R; }
      joy.x = dx / JOY_R; joy.y = dy / JOY_R;
      nub.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    };
    joyEl.addEventListener("pointerdown", (e) => { joy.active = true; joy.id = e.pointerId; joyEl.setPointerCapture?.(e.pointerId); if (mode !== "walk") applyMode("walk"); opts.onInteract?.(); updateJoy(e); });
    joyEl.addEventListener("pointermove", (e) => { if (joy.active && e.pointerId === joy.id) updateJoy(e); });
    const joyUp = (e) => { if (e.pointerId !== joy.id) return; joy.active = false; joy.x = joy.y = 0; nub.style.transform = "translate(-50%, -50%)"; };
    joyEl.addEventListener("pointerup", joyUp);
    joyEl.addEventListener("pointercancel", joyUp);

    // 間取り図（クリックでその部屋へ移動）
    const mm = opts.minimap, mmCtx = mm?.getContext("2d"), mmPad = 6;
    const mmTransform = () => {
      const w = mm.clientWidth, h = mm.clientHeight, s = Math.min((w - mmPad * 2) / W, (h - mmPad * 2) / D);
      return { w, h, s, ox: (w - W * s) / 2, oz: (h - D * s) / 2 };
    };
    function drawMinimap() {
      if (!mmCtx || !mm.clientWidth) return;
      const dpr = Math.min(window.devicePixelRatio || 1, 2), { w, h, s, ox, oz } = mmTransform();
      if (mm.width !== Math.round(w * dpr)) { mm.width = Math.round(w * dpr); mm.height = Math.round(h * dpr); }
      mmCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      mmCtx.clearRect(0, 0, w, h);
      const current = roomAt(player.x, player.z);
      for (const r of layout.rooms) {
        mmCtx.fillStyle = ROOM_COLORS[r.kind];
        mmCtx.fillRect(ox + r.x * s, oz + r.z * s, r.w * s, r.d * s);
        if (current === r && mode === "walk") { mmCtx.strokeStyle = "#d9822f"; mmCtx.lineWidth = 2; mmCtx.strokeRect(ox + r.x * s + 1, oz + r.z * s + 1, r.w * s - 2, r.d * s - 2); }
        mmCtx.fillStyle = "rgba(20,30,26,.75)";
        mmCtx.font = "10px sans-serif";
        mmCtx.textAlign = "center";
        mmCtx.fillText(`${r.name}`, ox + (r.x + r.w / 2) * s, oz + (r.z + r.d / 2) * s - 2);
        mmCtx.fillText(`${tatami(r)}帖`, ox + (r.x + r.w / 2) * s, oz + (r.z + r.d / 2) * s + 10);
      }
      mmCtx.fillStyle = "rgba(40,48,44,.9)";
      for (const b of colliders) mmCtx.fillRect(ox + b.x1 * s, oz + b.z1 * s, Math.max(1, (b.x2 - b.x1) * s), Math.max(1, (b.z2 - b.z1) * s));
      if (mode === "walk") {
        mmCtx.save();
        mmCtx.translate(ox + player.x * s, oz + player.z * s);
        mmCtx.rotate(-player.yaw);
        mmCtx.fillStyle = "rgba(217,130,47,.28)";
        mmCtx.beginPath(); mmCtx.moveTo(0, 0); mmCtx.arc(0, 0, 22, -Math.PI / 2 - 0.55, -Math.PI / 2 + 0.55); mmCtx.closePath(); mmCtx.fill();
        mmCtx.fillStyle = "#d9822f";
        mmCtx.beginPath(); mmCtx.moveTo(0, -7); mmCtx.lineTo(5, 5); mmCtx.lineTo(-5, 5); mmCtx.closePath(); mmCtx.fill();
        mmCtx.restore();
      }
      // 窓側（バルコニー側）の目印
      mmCtx.fillStyle = "rgba(60,120,190,.9)";
      mmCtx.font = "bold 10px sans-serif";
      mmCtx.fillText(`窓・${opts.facing ?? "南"}`, ox + (W / 2) * s, oz + D * s + mmPad + 2 > h ? h - 2 : oz + D * s + 10);
    }
    const onMinimapClick = (e) => {
      const rect = mm.getBoundingClientRect(), { s, ox, oz } = mmTransform();
      const x = (e.clientX - rect.left - ox) / s, z = (e.clientY - rect.top - oz) / s;
      if (roomAt(x, z)) { enterWalkAt(x, z); opts.onInteract?.(); }
    };
    mm?.addEventListener("click", onMinimapClick);

    const resize = () => {
      const w = container.clientWidth, h = container.clientHeight;
      if (!w || !h) return;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    };
    const ro = new ResizeObserver(resize);
    ro.observe(container);
    resize();

    // ループ
    let raf = 0, last = performance.now();
    const loop = (now) => {
      if (disposed) return;
      raf = requestAnimationFrame(loop);
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      if (mode === "walk") {
        const f = (keys.w || keys.arrowup ? 1 : 0) - (keys.s || keys.arrowdown ? 1 : 0) - joy.y;
        const strafe = (keys.d ? 1 : 0) - (keys.a ? 1 : 0) + joy.x;
        const turn = (keys.arrowleft ? 1 : 0) - (keys.arrowright ? 1 : 0);
        player.yaw += turn * 1.8 * dt;
        const mag = Math.hypot(f, strafe);
        if (mag > 0.05) {
          target = null; marker.visible = false;
          const nf = f / Math.max(1, mag), ns = strafe / Math.max(1, mag), sin = Math.sin(player.yaw), cos = Math.cos(player.yaw);
          tryMove((-sin * nf + cos * ns) * SPEED * dt, (-cos * nf - sin * ns) * SPEED * dt);
        } else if (target) {
          const dx = target.x - player.x, dz = target.z - player.z, d = Math.hypot(dx, dz);
          if (d < 0.06) { target = null; marker.visible = false; }
          else {
            let diff = Math.atan2(-dx, -dz) - player.yaw;
            diff = Math.atan2(Math.sin(diff), Math.cos(diff));
            player.yaw += diff * Math.min(1, dt * 5);
            const step = Math.min(d, SPEED * dt);
            if (!tryMove((dx / d) * step, (dz / d) * step)) { target = null; marker.visible = false; }
          }
        }
        camera.position.set(player.x, houseY + EYE, player.z);
        camera.rotation.set(player.pitch, player.yaw, 0);
      } else {
        camera.position.set(W / 2 + orbit.radius * Math.sin(orbit.pitch) * Math.sin(orbit.yaw), houseY + orbit.radius * Math.cos(orbit.pitch), D / 2 + orbit.radius * Math.sin(orbit.pitch) * Math.cos(orbit.yaw));
        camera.lookAt(W / 2, houseY, D / 2);
      }
      if (marker.visible) marker.rotation.z += dt * 2;
      const name = mode === "walk" ? roomAt(player.x, player.z)?.name ?? "" : "";
      if (name !== lastRoom) { lastRoom = name; opts.onRoom?.(name); }
      renderer.render(scene, camera);
      drawMinimap();
    };
    raf = requestAnimationFrame(loop);
    applyMode("walk");

    return {
      layout,
      sunLabel: sunCfg.label,
      setMode: (m) => applyMode(m),
      teleport: (room) => { enterWalkAt(room.x + room.w / 2, room.z + room.d * 0.3); player.yaw = Math.PI; },
      dispose() {
        disposed = true;
        cancelAnimationFrame(raf);
        ro.disconnect();
        window.removeEventListener("keydown", onKeyDown);
        window.removeEventListener("keyup", onKeyUp);
        window.removeEventListener("blur", onBlur);
        mm?.removeEventListener("click", onMinimapClick);
        scene.traverse((obj) => {
          obj.geometry?.dispose();
          for (const m of Array.isArray(obj.material) ? obj.material : obj.material ? [obj.material] : []) { m.map?.dispose(); m.dispose(); }
        });
        woodTex.dispose(); tileTex.dispose();
        renderer.dispose();
        canvas.remove(); joyEl.remove();
      },
    };
  }

  function addFurniture(THREE, group, f) {
    const g = new THREE.Group();
    const mat = (color, roughness = 0.8) => new THREE.MeshStandardMaterial({ color, roughness });
    const box = (w, h, d, y, m, x = 0, z = 0) => {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
      mesh.position.set(x, y + h / 2, z);
      mesh.castShadow = mesh.receiveShadow = true;
      g.add(mesh);
    };
    const along = f.d >= f.w;
    switch (f.kind) {
      case "bed": {
        box(f.w, 0.28, f.d, 0, mat(0x8a6a4c));
        box(f.w - 0.06, 0.18, f.d - 0.06, 0.28, mat(0xf4f1ea, 0.95));
        const pz = along ? -f.d / 2 + 0.25 : 0, px = along ? 0 : -f.w / 2 + 0.25;
        box(along ? f.w * 0.7 : 0.35, 0.1, along ? 0.35 : f.d * 0.7, 0.46, mat(0xffffff, 0.95), px, pz);
        box(along ? f.w - 0.04 : f.w * 0.55, 0.05, along ? f.d * 0.55 : f.d - 0.04, 0.46, mat(0x9fb3c8, 0.9), along ? 0 : f.w * 0.2, along ? f.d * 0.2 : 0);
        break;
      }
      case "desk":
        box(f.w, 0.04, f.d, 0.7, mat(0xc8a47a, 0.6));
        box(f.w - 0.1, 0.7, 0.04, 0, mat(0x9b7d5c), 0, along ? 0 : -f.d / 2 + 0.05);
        box(0.35, 0.05, 0.3, 0.72, mat(0x2e3238, 0.4), 0, 0);
        break;
      case "table":
        box(f.w, 0.04, f.d, 0.7, mat(0xa9784f, 0.6));
        for (const sx of [-1, 1]) for (const sz of [-1, 1]) box(0.05, 0.7, 0.05, 0, mat(0x6d4c33), (sx * (f.w - 0.1)) / 2, (sz * (f.d - 0.1)) / 2);
        break;
      case "lowtable":
        box(f.w, 0.04, f.d, 0.32, mat(0xd2b48c, 0.6));
        box(f.w - 0.1, 0.32, f.d - 0.1, 0, mat(0xb8976d));
        box(f.w + 0.6, 0.01, f.d + 0.6, 0, mat(0xd9d2c3, 1));
        break;
      case "sofa":
        box(f.w, 0.4, f.d, 0, mat(0x5b7c99));
        box(f.w, 0.4, 0.18, 0.4, mat(0x4f6e89), 0, f.d / 2 - 0.09);
        break;
      case "counter":
        box(f.w, 0.82, f.d, 0, mat(0xf2f0ec, 0.7));
        box(f.w, 0.04, f.d, 0.82, mat(0x9aa0a6, 0.3));
        box(Math.min(0.5, f.w * 0.3), 0.02, f.d * 0.6, 0.86, mat(0x5d6368, 0.2), -f.w * 0.25, 0);
        box(0.5, 0.02, f.d * 0.6, 0.86, mat(0x1d1f22, 0.5), f.w * 0.25, 0);
        break;
      case "tub":
        box(f.w, 0.55, f.d, 0, mat(0xf7f9fa, 0.3));
        box(f.w - 0.12, 0.02, f.d - 0.12, 0.54, mat(0xbfe0ec, 0.1));
        break;
      case "washer":
        box(f.w, 0.85, f.d, 0, mat(0xf4f5f6, 0.4));
        break;
      case "closet":
        box(f.w, 2.0, f.d, 0, mat(0xd8c6a8, 0.7));
        box(0.02, 1.9, 0.02, 0.05, mat(0x8a7456), 0, f.d / 2 + 0.01);
        break;
    }
    g.position.set(f.x, 0, f.z);
    group.add(g);
  }

  function makeWoodTexture(THREE) {
    const c = document.createElement("canvas");
    c.width = c.height = 512;
    const ctx = c.getContext("2d"), plank = 512 / 4;
    for (let i = 0; i < 4; i++) {
      ctx.fillStyle = `hsl(32, 38%, ${62 + ((i * 37) % 9)}%)`;
      ctx.fillRect(i * plank, 0, plank, 512);
      ctx.strokeStyle = "rgba(90,60,30,.12)";
      for (let g = 0; g < 14; g++) {
        ctx.beginPath();
        const x = i * plank + ((g * 53) % plank);
        ctx.moveTo(x, 0);
        ctx.bezierCurveTo(x + 6, 170, x - 6, 340, x + 3, 512);
        ctx.stroke();
      }
      ctx.fillStyle = "rgba(60,40,20,.35)";
      ctx.fillRect(i * plank, 0, 2, 512);
      ctx.fillRect(i * plank, ((i * 173) % 512) | 0, plank, 2);
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }

  function makeTileTexture(THREE) {
    const c = document.createElement("canvas");
    c.width = c.height = 128;
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#e9eef0";
    ctx.fillRect(0, 0, 128, 128);
    ctx.strokeStyle = "#b9c3c8";
    ctx.lineWidth = 3;
    ctx.strokeRect(0, 0, 128, 128);
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }

  window.Room3D = { open, buildLayout, preload: loadThree };
})();
</script>

  function income() {
    const v = (id) => Math.max(0, Number($(id).value) || 0);

  }
  const incomeTotal = () => Object.values(income()).reduce((a, b) => a + b, 0);
  const rentCap = () => Math.floor(incomeTotal() / 3 / 1000) * 1000;
  const overBudget = (p) => p.rent + p.fee > rentCap();

  // ---------- 判定 ----------
  function lifeGrade(p) { const n = p.near; const m = Math.max(n.supermarket.min, Math.min(n.clinic.min, n.hospital.min)); return m <= 5 ? ["good", "安心"] : m <= 10 ? ["warn", "ふつう"] : ["bad", "遠い"]; }
  function trafficGrade(p) { const l = p.traffic.level; return [l <= 2 ? "good" : l <= 3 ? "warn" : "bad", TRAFFIC_TEXT[l][0]]; }
  function hazardGrade(p) {
    const h = p.hazard;
    if (h.landslide || h.tsunami || (h.flood >= 2 && p.floor === 1) || h.flood >= 3) return ["bad", "要確認"];
    if (h.flood >= 1 || h.nearFlood >= 1 || p.near.shelter.min > 10) return ["warn", "注意"];
    return ["good", "安心"];
  }
  // 築年数から、どの耐震基準で建てられたかを推定する（建築確認の時期と建った年はずれることがある）
  function quakeStandard(p) {
    const built = new Date().getFullYear() - p.age;
    if (built < 1982) return ["bad", "旧耐震基準の可能性", `${built}年ごろの建築。1981年5月以前に建築確認を受けた建物は、今の基準より地震に弱い`];
    if (p.structure === "木造" && built < 2001) return ["warn", "新耐震基準（木造の2000年基準の前）", `${built}年ごろの建築。木造は2000年に接合部などの基準が強化された`];
    return ["good", "新耐震基準", `${built}年ごろの建築。1981年6月以降の基準${p.structure === "木造" ? "（木造の2000年基準も満たす時期）" : ""}`];
  }

    else if (screen === "map") { hideRoom3D(); renderBigMap(); renderSide(); }
    else renderDetail();
  }

  // ---------- 地図の共通部品 ----------
  function newMap(el) {
    const map = L.map(el, { crs: L.CRS.Simple, minZoom: -3.5, maxZoom: 1.5, zoomSnap: 0.25, zoomDelta: 0.5 });
    map.attributionControl.setPrefix(false).addAttribution(ATTRIBUTION);
    drawBase(map);
    return map;
  }

  function drawBase(map) {
    const d = state.data, renderer = L.canvas({ padding: 0.5 });
    const road = cssVar("--map-road"), rail = cssVar("--map-rail"), ground = cssVar("--map-ground");
    for (const w of d.map.ways) {
      const pts = [];
      for (let i = 0; i < w.p.length; i += 2) pts.push(ll(w.p[i], w.p[i + 1]));
      if (w.k === "rail") {
        L.polyline(pts, { renderer, color: rail, weight: 5, interactive: false }).addTo(map);
        L.polyline(pts, { renderer, color: ground, weight: 2.5, dashArray: "8 8", interactive: false }).addTo(map);
      } else {
        L.polyline(pts, { renderer, color: road, weight: [1.5, 1.5, 2, 3, 5, 7][w.r], interactive: false, lineCap: "round" }).addTo(map);
      }
    }
    for (const s of d.stations) {
      L.marker(ll(s.x, s.y), { icon: L.divIcon({ className: "", html: `<div class="st-pin">${esc(s.line)} ${esc(s.name)}</div>`, iconSize: null, iconAnchor: [0, 10] }), interactive: false }).addTo(map);
    }
    const g = d.campus.gates[0];
    L.marker(ll(g[0], g[1]), { icon: L.divIcon({ className: "", html: `<div class="campus-pin">近大キャンパス</div>`, iconSize: null, iconAnchor: [50, 12] }), interactive: false, zIndexOffset: 100 }).addTo(map);
  }

  function poiMarker(q, big = false) {
    const st = POI_STYLE[q.k], sz = big ? 24 : 17;
    const m = L.marker(ll(q.x, q.y), { icon: L.divIcon({ className: "", html: `<div class="pin" style="width:${sz}px;height:${sz}px;background:${st.c};font-size:${big ? 12 : 9}px">${st.t}</div>`, iconSize: [sz, sz], iconAnchor: [sz / 2, sz / 2] }), zIndexOffset: big ? 500 : 0 });
    m.bindTooltip(esc(q.n || st.label) + (q.e ? "（夜間救急）" : ""), { direction: "right", className: "lbl", offset: [8, 0], permanent: big });
    return m;
  }

  // 重ねる情報（交通量・浸水想定）の線や面を、指定した地図に描く
  function drawTraffic(target) {
    const renderer = L.canvas({ padding: 0.5 });
    for (const w of state.data.map.ways) {
      if (w.k === "rail" || w.r < 3) continue;
      const pts = [];
      for (let i = 0; i < w.p.length; i += 2) pts.push(ll(w.p[i], w.p[i + 1]));
      L.polyline(pts, { renderer, color: TRAFFIC_COLORS[Math.min(5, w.r)], weight: [0, 0, 0, 4, 7, 9][w.r], opacity: 0.9, interactive: false, lineCap: "round" }).addTo(target);
    }
  }
  function drawFlood(target) {
    // 同じ段階が横に続くマスは1つの長方形にまとめて描く
    const fg = state.data.hazard.flood, renderer = L.canvas({ padding: 0.5 });
    const colors = { 1: cssVar("--flood-1"), 2: cssVar("--flood-2"), 3: cssVar("--flood-3") };
    const rows = new Map();
    for (const [i, j, v] of fg.cells) { if (!rows.has(j)) rows.set(j, []); rows.get(j).push([i, Math.min(3, v)]); }
    for (const [j, arr] of rows) {
      arr.sort((a, b) => a[0] - b[0]);
      let start = null, prev = null;
      const flush = () => {
        if (!start) return;
        const x0 = fg.x0 + start[0] * fg.cell, x1 = fg.x0 + (prev[0] + 1) * fg.cell, y0 = fg.y0 + j * fg.cell;
        L.rectangle([ll(x0, y0), ll(x1, y0 + fg.cell)], { renderer, stroke: false, fillColor: colors[start[1]], fillOpacity: 0.42, interactive: false }).addTo(target);
      };
      for (const cur of arr) {
        if (start && cur[0] === prev[0] + 1 && cur[1] === start[1]) { prev = cur; continue; }
        flush(); start = cur; prev = cur;
      }
      flush();
    }
  }

  // ---------- ヒートマップ ----------
  // 地図全体を80m四方のマスに区切り、マスごとに観点別の住みやすさ（0〜1）を計算する。
  // 小さな画像にして地図に重ね、ブラウザの拡大補間でなめらかに見せる。
  function heatField() {
    if (heatCache) return heatCache;
    const d = state.data, [ex0, ey0, ex1, ey1] = d.map.extent, C = HEAT_CELL;
    const cols = Math.ceil((ex1 - ex0) / C), rows = Math.ceil((ey1 - ey0) / C);
    // 施設・キャンパスまでの距離は、データ作成時に道路網をたどって計算した道のり（m）を使う
    const w = d.walk;
    const walkAt = (key, x, y) => {
      const i = Math.floor((x - w.x0) / w.cell), j = Math.floor((y - w.y0) / w.cell);
      return i < 0 || j < 0 || i >= w.cols || j >= w.rows ? 9999 : w[key][j * w.cols + i];
    };
    const fl = d.hazard.flood, fcells = new Map(fl.cells.map(([i, j, v]) => [i + "," + j, v]));
    const nz = d.noise;
    const noiseAt = (x, y) => {
      const i = Math.floor((x - nz.x0) / nz.cell), j = Math.floor((y - nz.y0) / nz.cell);
      return i < 0 || j < 0 || i >= nz.cols || j >= nz.rows ? 55 : nz.db[j * nz.cols + i];
    };
    const lin = (dist, good, bad) => Math.max(0, Math.min(1, (bad - dist) / (bad - good)));
    const field = {}, raw = {};
    for (const t of HEAT_THEMES) { field[t.k] = new Float32Array(cols * rows); raw[t.k] = new Float32Array(cols * rows); }
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      const x = ex0 + (i + 0.5) * C, y = ey0 + (j + 0.5) * C, k = j * cols + i;
      const dSuper = walkAt("supermarket", x, y), dClinic = walkAt("clinic", x, y), db = noiseAt(x, y), dGate = walkAt("campus", x, y);
      const shop = lin(dSuper, 200, 1100) * 0.8 + lin(walkAt("convenience", x, y), 120, 600) * 0.2;
      const med = lin(dClinic, 200, 1000) * 0.6 + lin(walkAt("hospital", x, y), 400, 1800) * 0.4;
      const quiet = Math.max(0, Math.min(1, (68 - db) / 18)); // 屋外の騒音の推定 50dB以下で満点、68dB以上で0点
      const commute = lin(dGate, 400, 3000);
      raw.shop[k] = dSuper; raw.med[k] = dClinic; raw.quiet[k] = db; raw.commute[k] = dGate;
      const fi = Math.floor((x - fl.x0) / fl.cell), fj = Math.floor((y - fl.y0) / fl.cell);
      const safety = [1, 0.75, 0.4, 0.1, 0.05, 0, 0][fcells.get(fi + "," + fj) || 0];
      raw.safety[k] = fcells.get(fi + "," + fj) || 0;
      field.shop[k] = shop; field.med[k] = med; field.quiet[k] = quiet; field.commute[k] = commute; field.safety[k] = safety;
      const crime = crimeScore(x, y);
      field.crime[k] = crime;
      raw.crime[k] = crimeDensityAt(x, y) ?? 0;
      // 飲食店：近さと、400m以内の軒数（20軒で満点）を半分ずつ。バス停：近さ
      const dFood = walkAt("restaurant", x, y), nFood = walkAt("food400", x, y), dBus = walkAt("bus_stop", x, y);
      field.food[k] = lin(dFood, 150, 800) * 0.5 + Math.min(1, nFood / 20) * 0.5;
      raw.food[k] = dFood; raw.foodN = raw.foodN || new Float32Array(cols * rows); raw.foodN[k] = nFood;
      field.bus[k] = lin(dBus, 150, 800);
      raw.bus[k] = dBus;
      // コンビニ：いちばん近い店までの道のり
      const dConv = walkAt("convenience", x, y);
      field.conv[k] = lin(dConv, 100, 600);
      raw.conv[k] = dConv;
    }
    // 「エリアの中で上位何%か」を出すために、テーマごとに点を並べておく
    const sorted = {};
    for (const t of HEAT_THEMES) if (t.k !== "all") sorted[t.k] = Array.from(field[t.k]).sort((a, b) => a - b);
    heatCache = { field, raw, sorted, cols, rows, x0: ex0, y0: ey0 };
    computeOverall();
    return heatCache;
  }

  // 総合（あなた向け）＝重み付きの平均。平均すると差が小さくなるので、
  // エリアの中の下位5%〜上位5%を0〜1に広げて比べやすくする。重みを変えるたびに計算し直す
  function computeOverall() {
    const h = heatCache, w = state.weights, keys = Object.keys(DEFAULT_WEIGHTS);
    const total = keys.reduce((a, k) => a + w[k], 0) || 1;
    const a = h.field.all;
    for (let n = 0; n < a.length; n++) {
      let v = 0;
      for (const k of keys) v += h.field[k][n] * w[k];
      a[n] = v / total;
    }
    const s = Array.from(a).sort((x, y) => x - y);
    const lo = s[Math.floor(s.length * 0.05)], hi = s[Math.floor(s.length * 0.95)];
    for (let n = 0; n < a.length; n++) a[n] = hi > lo ? Math.max(0, Math.min(1, (a[n] - lo) / (hi - lo))) : a[n];
    h.raw.all.set(a);
    h.sorted.all = Array.from(a).sort((x, y) => x - y);
  }

  function setWeight(k, v) {
    state.weights[k] = v;
    saveWeights();
    heatField(); computeOverall();
    state.heatTheme = "all"; state.layers.add("heat");
    renderBigMap(); renderSide();
  }

  // マスごとの「まわり500m以内の年間件数」（物件と同じ数え方）。エリアの中の下位10%〜上位10%を「少ない〜多い」とする
  let crimeRange = null;
  function crimeDensityAt(x, y) {
    const g = state.data.crime.grid;
    const i = Math.floor((x - g.x0) / g.cell), j = Math.floor((y - g.y0) / g.cell);
    return i < 0 || j < 0 || i >= g.cols || j >= g.rows ? null : g.near[j * g.cols + i];
  }
  function crimeScore(x, y) {
    if (!crimeRange) {
      const v = state.data.crime.grid.near.slice().sort((a, b) => a - b);
      crimeRange = [v[Math.floor(v.length * 0.1)], v[Math.floor(v.length * 0.9)]];
    }
    const d = crimeDensityAt(x, y) ?? crimeRange[1];
    return Math.max(0, Math.min(1, (crimeRange[1] - d) / (crimeRange[1] - crimeRange[0])));
  }
  function crimeGrade(p) {
    // 物件の件数そのもので判定する（ヒートマップのマスと同じ物差し）
    const [lo, hi] = crimeRange || (crimeScore(0, 0), crimeRange);
    const s = Math.max(0, Math.min(1, (hi - p.crime.total) / (hi - lo)));
    return s >= 0.6 ? ["good", "少なめ"] : s >= 0.3 ? ["warn", "ふつう"] : ["bad", "多め"];
  }

  function heatColor(v) { return levelOf(v).color; }

  // その地点の評価：5段階、エリアの中での順位、実際の値
  function heatInfo(x, y, theme) {
    const h = heatField();
    const i = Math.floor((x - h.x0) / HEAT_CELL), j = Math.floor((y - h.y0) / HEAT_CELL);
    if (i < 0 || j < 0 || i >= h.cols || j >= h.rows) return null;
    const k = j * h.cols + i, v = h.field[theme][k], arr = h.sorted[theme];
    let lo = 0, hi = arr.length; // v より大きいマスの数を二分探索で数える
    while (lo < hi) { const m = (lo + hi) >> 1; if (arr[m] <= v) lo = m + 1; else hi = m; }
    const top = Math.max(1, Math.round(((arr.length - lo) + 1) / arr.length * 100));
    const text = rawText(theme, h.raw[theme][k]) + (theme === "food" && h.raw.foodN ? `・400m以内に${h.raw.foodN[k]}軒` : "");
    return { v, level: levelOf(v), top, text };
  }
  function rawText(theme, r) {
    const m = (d) => d >= 1000 ? `約${(d / 1000).toFixed(1)}km` : `約${Math.round(d / 10) * 10}m`;
    return {
      all: weightSummary(), shop: `スーパーまで道のり${m(r)}`, med: `診療所まで道のり${m(r)}`, quiet: `屋外 約${Math.round(r)}dB`,
      commute: `キャンパスまで道のり${m(r)}`, safety: r ? `浸水想定 ${state.data.hazard.floodLegend[r - 1]}` : "浸水想定なし",
      crime: `500m以内 年${Math.round(r)}件`,
      food: `飲食店まで道のり${m(r)}`, bus: `バス停まで道のり${m(r)}`, conv: `コンビニまで道のり${m(r)}`,
    }[theme];
  }
  // テーマごとに、エリアのマスが5段階それぞれにどれだけあるか（%）
  function levelShares(theme) {
    const vals = heatField().field[theme], cnt = LEVELS.map(() => 0);
    for (const v of vals) cnt[LEVELS.indexOf(levelOf(v))]++;
    return cnt.map((c) => Math.round((c / vals.length) * 100));
  }
  const levelChip = (lv) => `<span class="lv" style="background:${rgb(lv.color)}">${lv.mark}</span>`;

  function drawHeat() {
    if (!heatLayer) return;
    heatLayer.clearLayers();
    const { field, cols, rows, x0, y0 } = heatField(), vals = field[state.heatTheme];
    const cv = document.createElement("canvas"); cv.width = cols; cv.height = rows;
    const ctx = cv.getContext("2d"), img = ctx.createImageData(cols, rows);
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      const v = vals[j * cols + i], [r, g, b] = heatColor(v), o = ((rows - 1 - j) * cols + i) * 4;
      img.data[o] = r; img.data[o + 1] = g; img.data[o + 2] = b; img.data[o + 3] = 175;
    }
    ctx.putImageData(img, 0, 0);
    L.imageOverlay(cv.toDataURL(), [ll(x0, y0), ll(x0 + cols * HEAT_CELL, y0 + rows * HEAT_CELL)], { opacity: 0.72, interactive: false, className: "heat-img" }).addTo(heatLayer);
  }

  function heatAt(x, y, theme = "all") {
    const { field, cols, rows, x0, y0 } = heatField();
    const i = Math.floor((x - x0) / HEAT_CELL), j = Math.floor((y - y0) / HEAT_CELL);
    if (i < 0 || j < 0 || i >= cols || j >= rows) return null;
    return field[theme][j * cols + i];
  }

  // 町丁目ごとの年間件数を、面積が件数に比例する円で描く
  function drawCrime(target) {
    const renderer = L.canvas({ padding: 0.5 });
    for (const t of state.data.crime.towns) {
      if (!t.n) continue;
      L.circle(ll(t.x, t.y), { renderer, radius: Math.sqrt(t.n) * 14, color: CRIME_COLOR, weight: 1, fillColor: CRIME_COLOR, fillOpacity: 0.22, interactive: false }).addTo(target);
    }
  }

  // ---------- 大きい地図 ----------
  function buildLayers() {
    for (const ly of LAYERS) {
      const g = L.layerGroup();
      if (ly.kinds) for (const q of state.data.map.pois) if (ly.kinds.includes(q.k)) poiMarker(q).addTo(g);
      if (ly.k === "traffic") drawTraffic(g);
      if (ly.k === "flood") drawFlood(g);
      if (ly.k === "crime") drawCrime(g);
      if (ly.k === "heat") heatLayer = g;
      layerGroups[ly.k] = g;
    }
  }

  function renderBigMap() {
    if (!window.L) { $("bigMap").innerHTML = `<p style="padding:16px" class="muted">地図ライブラリを読み込めませんでした。通信状況を確かめて、ページを開き直してください。</p>`; return; }
    if (!maps.big) {
      maps.big = newMap($("bigMap"));
      buildLayers();
      maps.big.pins = L.layerGroup().addTo(maps.big);
      maps.big.focus = L.layerGroup().addTo(maps.big);
      const ext = state.data.map.extent;
      maps.big.fitBounds([ll(ext[0] + 400, ext[1] + 400), ll(ext[2] - 400, ext[3] - 400)]);
      maps.big.on("click", (e) => { if (state.sheet) { state.sheet = null; renderLayerChips(); } showReadout(e.latlng); if (state.selected) { state.selected = null; renderSide(); drawPins(); } });
      maps.big.on("mousemove", (e) => showReadout(e.latlng));
      maps.big.on("mouseout", () => { $("readout").hidden = true; });
    }
    maps.big.invalidateSize();
    for (const ly of LAYERS) {
      const g = layerGroups[ly.k];
      if (state.layers.has(ly.k)) g.addTo(maps.big); else g.remove();
    }
    if (state.layers.has("heat")) drawHeat();
    maps.big.pins.remove().addTo(maps.big); // 札をいつもいちばん上に
    renderLayerChips();
    drawPins();
  }

  function drawPins() {
    const map = maps.big;
    if (!map) return;
    map.pins.clearLayers();
    map.focus.clearLayers();
    for (const p of state.data.properties) {
      const on = p.id === state.selected, cls = on ? "on" : overBudget(p) ? "over" : "";
      const m = L.marker(ll(p.x, p.y), { icon: L.divIcon({ className: "", html: `<div class="price-pin ${cls}">${manShort(p.rent + p.fee)}</div>`, iconSize: [0, 0] }), zIndexOffset: on ? 3000 : overBudget(p) ? 1000 : 2000, title: p.name, keyboard: true });
      m.on("click", (e) => { L.DomEvent.stopPropagation(e); selectPin(p.id); });
      m.addTo(map.pins);
    }
    const p = state.selected && byId(state.selected);
    if (p) {
      const accent = cssVar("--accent");
      for (const [min, fill] of [[10, 0], [5, 0.08]]) {
        const r = min * 80 / 1.3;
        L.circle(ll(p.x, p.y), { radius: r, color: accent, weight: 2, dashArray: "6 8", fillColor: accent, fillOpacity: fill, interactive: false }).addTo(map.focus);
      }
    }
  }

  // カーソル（スマホではタップ）の地点の評価を、地図の右上に出す
  function showReadout(latlng) {
    const el = $("readout");
    if (!state.layers.has("heat")) { el.hidden = true; return; }
    const hi = heatInfo(latlng.lng, latlng.lat, state.heatTheme);
    if (!hi) { el.hidden = true; return; }
    const t = HEAT_THEMES.find((x) => x.k === state.heatTheme);
    el.innerHTML = `<div class="small muted">この地点の「${themeLabel(t.k)}」</div><div>${levelChip(hi.level)} <b>${hi.level.label}</b>　<span class="num">エリアの上位${hi.top}%</span></div><div class="small muted num">${esc(hi.text)}</div>`;
    el.hidden = false;
  }

  function selectPin(id) {
    if (state.selected === id) { go("detail", id); return; }
    state.selected = id;
    drawPins();
    renderSide();
    const p = byId(id);
    maps.big.panTo(ll(p.x, p.y), { animate: true });
  }

  // ---------- 地図のタスクバー ----------
  // 地図の下に「地図に重ねる／ヒートマップ／凡例」の3つだけを置き、タップするとそのカテゴリの中身を開く
  const ICONS = {
    layers: `<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M10 2.5 2.5 6.3 10 10l7.5-3.7L10 2.5Z"/><path d="m2.5 10 7.5 3.7 7.5-3.7"/><path d="m2.5 13.7 7.5 3.8 7.5-3.8"/></svg>`,
    heat: `<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="2" width="7.5" height="7.5" rx="1.5" fill="rgb(47,158,91)"/><rect x="10.5" y="2" width="7.5" height="7.5" rx="1.5" fill="rgb(231,195,58)"/><rect x="2" y="10.5" width="7.5" height="7.5" rx="1.5" fill="rgb(140,193,82)"/><rect x="10.5" y="10.5" width="7.5" height="7.5" rx="1.5" fill="rgb(200,65,47)"/></svg>`,
    legend: `<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M7 5h10M7 10h10M7 15h10"/><circle cx="3.5" cy="5" r="1" fill="currentColor"/><circle cx="3.5" cy="10" r="1" fill="currentColor"/><circle cx="3.5" cy="15" r="1" fill="currentColor"/></svg>`,
  };
  const src = (kind, text) => `<span class="src">${badge(kind)} ${text}</span>`;
  const dot = (k) => `<span><i class="dot" style="background:${POI_STYLE[k].c}">${POI_STYLE[k].t}</i>${POI_STYLE[k].label}</span>`;

  // レイヤーごとの凡例（色・記号の意味と出どころ）
  function legendFor(k) {
    return {
      shop: ["supermarket", "convenience", "chemist"].map(dot).join("") + src("実データ", "OpenStreetMap"),
      med: ["clinic", "hospital"].map(dot).join("") + src("実データ", "OpenStreetMap"),
      food: dot("restaurant") + `<span class="muted">レストラン・カフェ・ファストフード</span>` + src("実データ", "OpenStreetMap"),
      bus: dot("bus_stop") + src("実データ", "OpenStreetMap"),
      traffic: `<span><i style="background:${TRAFFIC_COLORS[5]}"></i>多い（幹線道路）</span><span><i style="background:${TRAFFIC_COLORS[4]}"></i>多め</span><span><i style="background:${TRAFFIC_COLORS[3]}"></i>ふつう</span>${src("推定", "道路の種類から。実測ではない")}`,
      flood: `<span><i style="background:var(--flood-1);opacity:.7"></i>0.5m未満</span><span><i style="background:var(--flood-2);opacity:.7"></i>0.5〜3m</span><span><i style="background:var(--flood-3);opacity:.7"></i>3m以上</span>${src("実データ", "国土地理院 洪水浸水想定区域（想定最大規模）・内水氾濫は含まない")}`,
      crime: `<span><i style="background:${CRIME_COLOR};opacity:.35;border-radius:50%;width:12px;height:12px"></i>町丁目ごとの犯罪の件数（円が大きいほど多い）</span>${dot("police")}${src("実データ", "大阪府警察 犯罪オープンデータ（2025年）を加工・交番はOpenStreetMap")}`,
      shelter: `${dot("shelter")}<span class="muted">洪水のとき</span>${src("実データ", "国土地理院 指定緊急避難場所")}`,
    }[k] || "";
  }
  const THEME_HINT = {
    all: "テーマの平均", shop: "スーパーが近いほど緑", med: "診療所が近いほど緑", quiet: "車や電車の音が小さいほど緑",
    commute: "大学が近いほど緑", safety: "浸水しにくいほど緑", crime: "犯罪が少ないほど緑",
    food: "飲食店が近くて多いほど緑", bus: "バス停が近いほど緑", conv: "コンビニが近いほど緑",
  };
  const LAYER_DESC = {
    shop: "スーパー・コンビニ・ドラッグストアの場所", med: "診療所・病院の場所",
    food: "レストラン・カフェ・ファストフードの場所", bus: "バス停の場所", traffic: "車の多い道路を色分け",
    flood: "大雨で川があふれたときの浸水想定", crime: "町丁目ごとの犯罪の件数と交番", shelter: "洪水のときの避難場所",
  };

  function heatLegend() {
    const scale = HEAT_SCALE[state.heatTheme], share = levelShares(state.heatTheme);
    return `<div class="row">${LEVELS.map((l, n) => `<span class="lv-item">${levelChip(l)}${l.label}<span class="muted num" style="font-weight:400">（${share[n]}%）</span></span>`).join("")}</div>
      <p class="note">（　）は、このエリアのうちその段階にあたる場所の割合。×：${scale[0]}　◎：${scale[1]}</p>
      <div class="row">${src(state.heatTheme === "quiet" ? "推定" : "独自の目安", scale[2])}</div>`;
  }
  const pinLegend = () => `<div class="row"><span><span class="price-pin" style="display:inline-block;transform:none;font-size:11px;padding:0 6px">4.2万</span> 物件（家賃＋管理費）</span><span class="muted">薄い札は予算オーバー</span>${src("架空", "物件はデモ用")}</div>`;

  function renderLayerChips() {
    const overlays = LAYERS.filter((ly) => ly.k !== "heat");
    const on = overlays.filter((ly) => state.layers.has(ly.k)).length, heatOn = state.layers.has("heat");
    const theme = themeLabel(state.heatTheme);
    const btn = (k, label, sub) => `<button class="tb" data-sheet="${k}" aria-expanded="${state.sheet === k}">${ICONS[k]}<span class="tb-label">${label}</span><span class="tb-sub">${sub}</span></button>`;
    $("taskbar").innerHTML = btn("layers", "地図に重ねる", on ? `${on}つ表示中` : "なし") + btn("heat", "ヒートマップ", heatOn ? theme : "オフ") + btn("legend", "凡例", "色と記号の意味");

    // ヒートマップの5段階だけは、いつも地図の上に小さく出す
    $("heatStrip").hidden = !heatOn;
    if (heatOn) $("heatStrip").innerHTML = `<b>${theme}</b> ${LEVELS.map((l) => levelChip(l)).join("")}<span class="muted">左ほど良い</span>`;

    const el = $("sheet");
    el.hidden = !state.sheet;
    if (state.sheet === "layers") {
      el.innerHTML = `<div class="sheet-head"><h3>地図に重ねる情報</h3><span class="muted small">いくつでも選べます</span></div>
        <div class="sheet-list">${overlays.map((ly) => `
          <button class="opt-row" data-k="${ly.k}" aria-pressed="${state.layers.has(ly.k)}">
            <span class="switch" aria-hidden="true"></span>
            <span class="opt-text"><b style="--c:${ly.color}">${ly.label}</b><span class="muted small">${LAYER_DESC[ly.k]}</span>
            ${state.layers.has(ly.k) ? `<span class="legend-row">${legendFor(ly.k)}</span>` : ""}</span>
          </button>`).join("")}</div>`;
    } else if (state.sheet === "heat") {
      el.innerHTML = `<div class="sheet-head"><h3>ヒートマップ</h3>
          <button class="opt-row compact" data-k="heat" aria-pressed="${heatOn}"><span class="switch" aria-hidden="true"></span><span>${heatOn ? "表示中" : "オフ"}</span></button></div>
        <p class="small muted">何を基準に住みやすさを塗るかを選びます。</p>
        <div class="theme-grid">${HEAT_THEMES.map((t) => `<button class="theme" data-t="${t.k}" aria-pressed="${heatOn && state.heatTheme === t.k}"><b>${themeLabel(t.k)}</b><span>${t.k === "all" ? esc(weightSummary()) : THEME_HINT[t.k]}</span></button>`).join("")}</div>
        <div class="weights">
          <div class="sheet-head"><b>あなた向けの総合：何を大事にする？</b>
            <span class="row" style="margin:0"><button class="linkbtn" data-preset="persona">おすすめ</button><button class="linkbtn" data-preset="reset">元に戻す</button></span></div>
          ${HEAT_THEMES.filter((t) => t.k !== "all").map((t) => `<div class="w-row"><span>${t.label}</span><span class="seg" role="group" aria-label="${t.label}の大事さ">${WEIGHT_STEPS.map(([v, l]) => `<button data-w="${t.k}" data-v="${v}" aria-pressed="${state.weights[t.k] === v}">${l}</button>`).join("")}</span></div>`).join("")}
          <p class="note">「大事」は「ふつう」の3倍の重さで平均します。選ぶと「あなた向け」の総合に切り替わります。「おすすめ」は、ペルソナ（親も一緒に決める新入生）に合わせて、買い物・浸水しにくさ・防犯を大事にした設定です。</p>
        </div>
        ${heatLegend()}`;
    } else if (state.sheet === "legend") {
      const active = overlays.filter((ly) => state.layers.has(ly.k));
      el.innerHTML = `<div class="sheet-head"><h3>凡例</h3><span class="muted small">いま地図に出ているもの</span></div>

        ${heatOn ? `<div class="legend-block"><b>ヒートマップ「${theme}」</b>${heatLegend()}</div>` : ""}
        ${active.map((ly) => `<div class="legend-block"><b>${ly.label}</b><div class="row">${legendFor(ly.k)}</div></div>`).join("") || (heatOn ? "" : `<p class="small muted">重ねている情報はありません。「地図に重ねる」から選べます。</p>`)}`;
    }
  }

  // ---------- 右側（使い方／選んだ物件の概要） ----------
  // ---------- 地図の上のヘヤまる ----------
  // 何も選んでいないとき・物件を選んだとき・ヒートマップや重ねる情報を変えたときに、表情とひとことを変える
  let guideTimer = null;
  function setMapGuide(face, text, { temporary = false } = {}) {
    const el = $("mapGuide");
    if (!el) return;
    clearTimeout(guideTimer);
    el.innerHTML = `<div class="bubble map-bubble">${esc(text)}</div>${mascotSVG(78, "hop", face)}`;
    if (temporary) guideTimer = setTimeout(() => mapGuideForSelection(), 4500);
  }
  function mapGuideForSelection() {
    const p = state.selected && byId(state.selected);
    if (!p) { setMapGuide("smile", "気になる札をタップしてね。ヒートマップが緑のところほど住みやすいよ"); return; }
    // 良いところと気になるところを1つずつ拾って、表情を決める
    const goods = [], bads = [];
    if (!overBudget(p)) goods.push("予算内"); else bads.push("予算を少し超える");
    const add = (g, good, bad) => { if (g[0] === "good") goods.push(good); else if (g[0] === "bad") bads.push(bad); };
    add(lifeGrade(p), "スーパーも近い", "スーパーや病院が遠め");
    add(trafficGrade(p), "車の音が少ない", "大きな道が近い");
    add(crimeGrade(p), "犯罪が少なめ", "犯罪が多めのエリア");
    add(hazardGrade(p), "災害のリスクが低め", "災害のリスクが高め");
    if (p.noise.dValue <= 35) bads.push("隣の音が響きやすい");
    const face = bads.length === 0 ? "happy" : bads.length === 1 ? "think" : "worry";
    const q = (arr) => `「${arr.slice(0, 2).join("」「")}」`;
    const text = bads.length === 0 ? `いいところは${q(goods)}。いい部屋かも！「詳しく見る」で中も見てみよう`
      : goods.length ? `いいところは${q(goods)}、気になるのは${q(bads)}。「詳しく見る」で確かめよう`
      : `気になるのは${q(bads)}。ほかの札も見てみよう`;
    setMapGuide(face, text);
  }

  function renderSide() {
    mapGuideForSelection();
    const p = state.selected && byId(state.selected);
    if (!p) {
      const inBudget = state.data.properties.filter((x) => !overBudget(x)).length;
      $("sidePanel").innerHTML = `
        <div class="intro">
          <div class="eyebrow">大学進学ではじめての一人暮らし</div>
          <h2>気になる場所をタップして、部屋を選ぶ</h2>
        </div>
        <div class="howto">
          <b>1</b><span>地図の下のタスクバーで、ヒートマップのテーマや、スーパー・病院・交通量・浸水想定・防犯などを切り替える</span>
          <b>2</b><span>気になる場所にある物件（金額の札）をタップ</span>
          <b>3</b><span>「詳しく見る」で、住宅の情報・内見で聞くこと・親への相談までまとまる</span>
        </div>
        <p class="small">いまの予算（家賃＋管理費 <b class="num">${man(rentCap())}</b> まで）に合う部屋は <b class="num">${inBudget}件</b>／全${state.data.properties.length}件</p>
        <div class="sources">
          <div class="src-head"><b>データの出どころ</b><button class="linkbtn" id="moreSources">くわしく見る</button></div>
          <table class="src-table">${DATA_SOURCES.filter((d) => d.group !== "calc").map((d) => `<tr><td>${esc(d.what)}</td><td>${providerLink(d)}</td></tr>`).join("")}</table>
          <p>騒音・徒歩分数・ヒートマップなどは、これらをもとに計算した目安です。</p>
        </div>`;
      return;
    }
    const n = p.near, lg = lifeGrade(p), tg = trafficGrade(p), hg = hazardGrade(p), over = overBudget(p);
    $("sidePanel").innerHTML = `
      <div class="pv-head">
        <div>
          <div class="eyebrow">選んだ物件 <span class="demo-flag">架空データ</span></div>

        </div>
        <div class="pv-price num"><strong>${man(p.rent)}</strong><div class="small muted">＋管理費 ${yen(p.fee)}</div></div>
      </div>
      <div class="budget-line ${over ? "over" : "ok"} num">${over ? `予算（${man(rentCap())}）を ${yen(p.rent + p.fee - rentCap())} 超える` : `予算 ${man(rentCap())} 以内`}</div>
      <div class="facts num">
        <div class="fact"><div class="k">大学まで</div><div class="v">徒歩${p.campus.min}分</div><div class="s">自転車 約${p.campus.bike}分</div></div>
        <div class="fact ${lg[0]}"><div class="k">スーパー・病院</div><div class="v">${n.supermarket.min}分・${n.hospital.min}分</div><div class="s">${esc(n.supermarket.name)}</div></div>
        <div class="fact ${tg[0]}"><div class="k">まわりの交通量</div><div class="v">${tg[1]}</div><div class="s">${esc(p.traffic.front)}</div></div>
        <div class="fact ${hg[0]}"><div class="k">災害</div><div class="v">${hg[1]}</div><div class="s">${floodShort(p)}</div></div>
        <div class="fact ${crimeGrade(p)[0]}"><div class="k">まわりの犯罪</div><div class="v">${crimeGrade(p)[1]}</div><div class="s">500m以内 年${p.crime.total}件・交番${p.near.police.min}分</div></div>
        <div class="fact ${p.noise.dValue >= 45 ? "good" : p.noise.dValue >= 40 ? "warn" : "bad"}"><div class="k">隣の部屋の音</div><div class="v">D-${p.noise.dValue}</div><div class="s">${esc(p.structure)}</div></div>
      </div>
      <div class="small muted">この場所の評価（◎とても良い〜×悪い・エリアの中での順位） ${badge("独自の目安")}</div>
      <div class="rank-grid num">${HEAT_THEMES.map((t) => {
        const hi = heatInfo(p.x, p.y, t.k);
        if (!hi) return "";
        return `<div class="rank-cell" title="${esc(`${themeLabel(t.k)}：${hi.level.label}（エリアの上位${hi.top}%）・${hi.text}`)}"><span class="rc-k">${themeLabel(t.k)}</span><span class="rc-v">${levelChip(hi.level)}<span class="rc-t">上位${hi.top}%</span></span></div>`;
      }).join("")}</div>
      <button class="btn" id="openDetail" style="padding:12px" title="同じ札をもう一度タップしても開きます">詳しく見る →</button>`;
  }

  // ---------- 詳しい住宅情報 ----------
  // 住宅詳細のヘヤまる：開いているタブと評価に合わせて、表情とひとことを変える
  function mascotLine(p, tab) {
    const byGrade = (g, good, warn, bad) => g === "good" ? ["happy", good] : g === "warn" ? ["think", warn] : ["worry", bad];
    const d = p.noise.dValue;
    switch (tab) {
      case "room": return ["surprised", "部屋の中を歩いてみよう。「上から見る」で間取り全体も見られるよ"];
      case "building": return d >= 45 ? ["happy", "壁がしっかりしていて、隣の音は気になりにくそう"] : d >= 40 ? ["think", "隣の音はふつう。夜の静けさは内見で確かめよう"] : ["worry", "隣の音が響きやすいかも。内見で必ず聞いてみて"];
      case "life": return byGrade(lifeGrade(p)[0], "スーパーも病院も近くて、暮らしやすそう！", "買い物は少し歩くかも。道のりを見てみて", "スーパーや病院が遠め。自転車があると安心");
      case "traffic": return byGrade(trafficGrade(p)[0], "車は少なめ。静かに過ごせそう", "車の音はふつう。窓を閉めれば気になりにくいよ", "大きな道が近いよ。音と排気ガスに気をつけて");
      case "hazard": return byGrade(hazardGrade(p)[0], "浸水の想定はない場所。避難場所も覚えておこう", "近くに浸水想定の区域があるよ。階数も確かめてね", "災害のリスクが高め。親にも相談しよう");
      case "crime": return byGrade(crimeGrade(p)[0], "まわりの犯罪は少なめ。安心して住めそう", "自転車盗が多めのエリア。鍵は2つ付けよう", "犯罪が多めの場所。夜道と駐輪場を確かめよう");
      case "money": return byGrade(moneyGrade(p)[0], "毎月のお金に余裕がありそう！", "ちょっとギリギリかも。食費を見直してみよう", "毎月赤字になりそう。予算を見直そう");
      case "check": return ["think", "ビデオ通話で、これだけ聞けばだいじょうぶ"];
      case "parent": return ["happy", "親にも見てもらって、安心して決めよう"];
      default: return ["smile", "気になるところをタブで見てみよう"];
    }
  }

  function renderDetail() {
    const p = byId(state.selected);
    const [face, line] = mascotLine(p, state.tab);
    $("dHead").innerHTML = `
      <div>
        <div class="eyebrow">詳しい住宅情報 <span class="demo-flag">物件はデモ用の架空データ</span></div>
        <h2>${esc(p.name)}</h2>
        <div class="spec num">${p.layout}・${p.size}㎡・${esc(p.structure)}・築${p.age}年・${p.floor}階／${p.floors}階建て${p.autolock ? "・オートロック" : ""}${p.net ? "・ネット無料" : ""}・${esc(p.station.line)} ${esc(p.station.name)} 徒歩${p.station.min}分</div>
      </div>
      <div class="d-guide" aria-live="polite">${mascotSVG(68, "hop", face)}<div class="bubble d-bubble" title="${esc(line)}"><span>${esc(line)}</span></div></div>
      <div class="pv-price num"><strong>${man(p.rent)}</strong><div class="small muted">＋管理費 ${yen(p.fee)}・敷${p.deposit} 礼${p.key}</div></div>`;
    const tabs = [
      ["room", "部屋の中（3D）", null], ["building", "建物", buildingGrade(p)], ["life", "暮らし", lifeGrade(p)], ["traffic", "交通量", trafficGrade(p)], ["hazard", "災害", hazardGrade(p)], ["crime", "防犯", crimeGrade(p)],
      ["money", "お金", moneyGrade(p)], ["check", "内見で聞くこと", null], ["parent", "親に相談", null],
    ];
    $("tabs").innerHTML = tabs.map(([k, label, v]) => `<button class="tab" role="tab" data-tab="${k}" aria-selected="${state.tab === k}">${label}${v ? `<span class="v v-${v[0]}">${v[1]}</span>` : ""}</button>`).join("");
    $("tabBody").innerHTML = tabContent(p, state.tab);
    if (state.tab === "parent") { $("letter").value = letterTemplate(p); $("letterBtn").textContent = state.sample ? "AIで文章を整える" : "ひな形に戻す"; }
    if (state.tab === "room") showRoom3D(p);
    else { hideRoom3D(); drawMiniMap(p); }
  }

  // ---------- 部屋の中（3D） ----------
  // 3D内見の仕組み（間取りの組み立て・three.js の部屋と操作）は kurashi-ai から移植した window.Room3D を使う
  const room3d = { api: null, token: 0 };
  async function showRoom3D(p) {
    const box = $("room3dBox"), token = ++room3d.token;
    room3d.api?.dispose(); room3d.api = null;
    box.hidden = false;
    $("miniMap").style.visibility = "hidden";
    $("r3dRoom").textContent = "";
    $("r3dMsg").textContent = "3Dの部屋を準備しています…";
    $("r3dMsg").hidden = false;
    try {
      const api = await window.Room3D.open(box, {
        type: p.layout, area: p.size, floor: p.floor, facing: p.facing, balcony: p.balcony,
        minimap: $("r3dMinimap"),
        onRoom: (name) => { $("r3dRoom").textContent = name ? `いまいる場所：${name}` : ""; $("r3dRoom").hidden = !name; },
        onMode: (m) => document.querySelectorAll("[data-r3dmode]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.r3dmode === m))),
        onInteract: () => { $("r3dMsg").hidden = true; },
      });
      if (token !== room3d.token) { api.dispose(); return; }
      room3d.api = api;
      if ($("r3dSun")) $("r3dSun").textContent = api.sunLabel;
      $("r3dMsg").textContent = "ドラッグで見まわす／床をクリックで歩く";
      setTimeout(() => { if (token === room3d.token) $("r3dMsg").hidden = true; }, 4000);
    } catch (e) {
      if (token !== room3d.token) return;
      $("r3dMsg").textContent = e?.message === "webgl"
        ? "お使いのブラウザでは3D表示を始められませんでした。右の間取りの情報をご覧ください。"
        : "3D表示の部品（three.js）を読み込めませんでした。通信状況を確かめて、タブを開き直してください。";
    }
  }
  function hideRoom3D() {
    room3d.token++;
    room3d.api?.dispose(); room3d.api = null;
    $("room3dBox").hidden = true;
    $("miniMap").style.visibility = "";
  }

  function drawMiniMap(p) {
    const el = $("miniMap");
    if (!window.L) { el.innerHTML = `<p style="padding:16px" class="muted">地図を表示できませんでした。</p>`; return; }
    const mode = ["hazard", "traffic", "crime"].includes(state.tab) ? state.tab : "life";
    if (maps.mini && maps.mini.pid === p.id && maps.mini.mode === mode) { maps.mini.invalidateSize(); return; }
    if (maps.mini) { maps.mini.remove(); maps.mini = null; }
    const map = newMap(el);
    map.pid = p.id; map.mode = mode;
    maps.mini = map;
    // タブに合わせて、地図に重ねる情報を切り替える
    if (mode === "traffic") drawTraffic(map);
    if (mode === "hazard") drawFlood(map);
    if (mode === "crime") {
      drawCrime(map);
      L.circle(ll(p.x, p.y), { radius: state.data.crime.radius, color: CRIME_COLOR, weight: 2, fill: false, interactive: false }).addTo(map);
    }
    const accent = cssVar("--accent");
    for (const [min, fill] of [[10, 0], [5, 0.07]]) {
      const r = min * 80 / 1.3;
      L.circle(ll(p.x, p.y), { radius: r, color: accent, weight: 2, dashArray: "6 8", fillColor: accent, fillOpacity: fill, interactive: false }).addTo(map);
      L.marker(ll(p.x, p.y + r), { icon: L.divIcon({ className: "", html: "", iconSize: [0, 0] }), interactive: false }).addTo(map)
        .bindTooltip(`徒歩${min}分`, { permanent: true, direction: "top", className: "lbl" });
    }
    const show = mode === "hazard" ? ["shelter"] : mode === "crime" ? ["police"] : mode === "traffic" ? [] : ["supermarket", "convenience", "chemist", "clinic", "hospital", "bus_stop"];
    const nearest = new Set(Object.values(p.near).map((q) => q.x + "," + q.y));
    for (const q of state.data.map.pois) {
      if (!show.includes(q.k) || Math.hypot(q.x - p.x, q.y - p.y) > 1000) continue;
      poiMarker(q, nearest.has(q.x + "," + q.y)).addTo(map);
    }
    L.marker(ll(p.x, p.y), { icon: L.divIcon({ className: "", html: `<div class="home-pin"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M1 8 8 1l7 7v7H1z" fill="#1b2521"/></svg></div>`, iconSize: [34, 34], iconAnchor: [17, 17] }), zIndexOffset: 2000, title: p.name }).addTo(map);
    map.setView(ll(p.x, p.y), -0.9);
  }

  function tabContent(p, tab) {
    const n = p.near, h = p.hazard, tr = p.traffic, inc = income(), incT = incomeTotal();
    if (tab === "room") {
      const open = Math.round(p.noise.outdoor - 10);
      return `
      <div><div class="eyebrow">部屋の中を3Dで見る</div><div class="big-verdict num" style="font-size:20px">${p.layout}・${p.size}㎡・${p.floor}階／${p.floors}階建て</div></div>
      <div class="row"><span class="seg" role="group" aria-label="見かた"><button data-r3dmode="walk" aria-pressed="true">歩いて見る</button><button data-r3dmode="dollhouse" aria-pressed="false">上から見る</button></span></div>
      <div><div class="small muted">間取り（タップでその部屋へ移動）</div><canvas id="r3dMinimap" class="r3d-minimap"></canvas></div>
      <p class="small" id="r3dSun"></p>
      <dl class="rows num">
        <dt>窓の向き</dt><dd>${esc(p.facing)}${p.balcony ? "・バルコニーあり" : ""}</dd>
        <dt>隣の部屋の音</dt><dd>D-${p.noise.dValue} 相当　${esc(dFeel(p.noise.dValue))}</dd>
        <dt>外の音</dt><dd>窓を閉めて約${p.noise.indoor}dB／開けて約${open}dB<br><span class="small muted">${esc(dbFeel(p.noise.indoor))}（窓を閉めたとき）</span></dd>
      </dl>
      <p class="note">操作：ドラッグで見まわす／床をクリックでそこまで歩く／W A S D・矢印キー・左下のスティックで移動／ホイールで前後</p>
      <p class="note">${badge("推定")} 3Dは間取り図から読み取ったものではなく、間取りタイプと面積から組み立てた簡易モデルです（部屋の配置・寸法・家具は目安）。窓を開けたときの音は、屋外の推定値から10dB引いた目安。3D内見のしくみは <a href="https://github.com/daichi05xxx-commits/kurashi-ai" target="_blank" rel="noopener">kurashi-ai</a> から移植しました。　${badge("架空")} 窓の向き・バルコニーはデモ用のデータ</p>`;
    }
    if (tab === "building") {
      const st = STRUCTURES[p.structure], q = quakeStandard(p);
      const meter = (v) => `<span class="meter3">${[1, 2, 3].map((i) => `<i class="${i <= v ? "on" : ""}"></i>`).join("")}</span>`;
      return `
      <div><div class="eyebrow">家の材質（構造）</div><div class="big-verdict">${esc(st.full)}</div></div>

        <dt>スーパー</dt><dd>徒歩${n.supermarket.min}分　${esc(n.supermarket.name)}${n.supermarket.hours === "24/7" ? "（24時間）" : ""}</dd>
        <dt>コンビニ</dt><dd>徒歩${n.convenience.min}分　${esc(n.convenience.name)}</dd>
        <dt>ドラッグストア</dt><dd>徒歩${n.chemist.min}分　${esc(n.chemist.name)}</dd>
        <dt>診療所</dt><dd>徒歩${n.clinic.min}分　${esc(n.clinic.name)}</dd>
        <dt>病院</dt><dd>徒歩${n.hospital.min}分　${esc(n.hospital.name)}</dd>
        <dt>飲食店</dt><dd>徒歩${n.restaurant.min}分　${esc(n.restaurant.name || "飲食店")}<br><span class="small muted">400m以内に${tr.food400}軒</span></dd>
