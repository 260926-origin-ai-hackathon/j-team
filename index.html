<style>
  :root {
    --bg: #eef2ef;
    --surface: #ffffff;
    --surface-2: #f6f8f6;
    --ink: #1b2521;
    --muted: #5b6862;
    --line: #d5ddd8;
    --accent: #0d7a65;
    --accent-soft: #dcefe9;
    --on-accent: #ffffff;
    --mark: #f5d547;
    --good: #2f8a52;
    --warn: #c47a16;
    --bad: #bf3f2c;
    --map-ground: #f7f9f7;
    --map-road: #c3ccc6;
    --map-rail: #6d7a74;
    --flood-1: #8ec3ee;
    --flood-2: #3f8fd6;
    --flood-3: #1f5fa8;
    --display: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
    --body: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #111715; --surface: #19211e; --surface-2: #1f2925; --ink: #e4ece8; --muted: #9aa9a2;
      --line: #2e3a35; --accent: #3cc3a2; --accent-soft: #173b33; --on-accent: #0b1411; --mark: #cdb03a;
      --good: #58c083; --warn: #e0a044; --bad: #ef7461;
      --map-ground: #151c19; --map-road: #3a4842; --map-rail: #8b9993;
      --flood-1: #2d5f8c; --flood-2: #3f86c9; --flood-3: #7fb6ea;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #111715; --surface: #19211e; --surface-2: #1f2925; --ink: #e4ece8; --muted: #9aa9a2;
    --line: #2e3a35; --accent: #3cc3a2; --accent-soft: #173b33; --on-accent: #0b1411; --mark: #cdb03a;
    --good: #58c083; --warn: #e0a044; --bad: #ef7461;
    --map-ground: #151c19; --map-road: #3a4842; --map-rail: #8b9993;
    --flood-1: #2d5f8c; --flood-2: #3f86c9; --flood-3: #7fb6ea;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--body);
    font-size: 15px; line-height: 1.65; overflow: hidden; margin: 0; padding-inline: 16px; padding-block: 0;
  }
  h1, h2, h3 { font-family: var(--display); line-height: 1.3; text-wrap: balance; margin: 0; }
  p { margin: 0; }
  .num { font-variant-numeric: tabular-nums; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }

  /* ---- 枠 ---- */
  .app { height: 100%; max-width: 1400px; margin: 0 auto; display: grid; grid-template-rows: auto minmax(0, 1fr); padding-bottom: 14px; }
  header.top { display: flex; align-items: center; gap: 12px; padding-block: 10px; min-width: 0; }
  .logo { font-family: var(--display); font-weight: 900; font-size: 21px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .logo[hidden] { display: none; }
  .tagline { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .spacer { flex: 1; }
  .chip-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .chip-btn b { font-family: var(--display); color: var(--accent); }
  .ai-state { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .ai-state.on { color: var(--accent); border-color: var(--accent); }
  @media (max-width: 720px) { .tagline, .ai-state { display: none; } }

  .stage { position: relative; min-height: 0; }
  .screen { position: absolute; inset: 0; min-height: 0; }
  .screen[hidden] { display: none !important; }
  @media (prefers-reduced-motion: no-preference) {
    .screen { animation: in .25s ease both; }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  }

  .btn { border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); font-weight: 700; border-radius: 10px; padding: 9px 18px; cursor: pointer; white-space: nowrap; }
  .btn.ghost { background: transparent; color: var(--accent); }
  .btn:disabled { opacity: .55; cursor: progress; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; min-height: 0; }
  .eyebrow { font-size: 12px; letter-spacing: .08em; color: var(--muted); font-weight: 700; margin-bottom: 4px; }

  /* ---- 地図の画面 ---- */
  .s-map { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 14px; }
  .mapwrap { position: relative; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--map-ground); min-height: 0; }
  .map { position: absolute; inset: 0; }
  .layers { position: absolute; top: 10px; left: 56px; right: 10px; z-index: 600; display: flex; flex-wrap: wrap; gap: 6px; pointer-events: none; }
  .layer { pointer-events: auto; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px 5px 8px; font-size: 13px; font-weight: 700; cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .layer .sw { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; opacity: .4; }
  .layer[aria-pressed="true"] { border-color: var(--ink); }
  .layer[aria-pressed="true"] .sw { opacity: 1; background: currentColor; }
  .legend { position: absolute; left: 10px; bottom: 10px; z-index: 600; display: grid; gap: 3px; padding: 8px 10px; border-radius: 10px; font-size: 12px; background: var(--surface); border: 1px solid var(--line); max-width: calc(100% - 20px); }
  .legend:empty { display: none; }
  .heat-themes { pointer-events: auto; display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .ht { border: none; background: none; border-radius: 999px; padding: 3px 10px; font-size: 12.5px; cursor: pointer; font-weight: 700; color: var(--muted); }
  .ht[aria-pressed="true"] { background: #2f9e5b; color: #fff; }
  .legend .heat-bar { display: inline-block; width: 90px; height: 10px; border-radius: 3px; background: linear-gradient(90deg, rgb(210,60,42), rgb(242,201,76), rgb(47,158,91)); }
  .heat-img { image-rendering: auto; }
  .heat-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; font-size: 11px; color: var(--muted); text-align: center; }
  .heat-row i { display: block; height: 10px; border-radius: 3px; margin-bottom: 2px; }
  .legend .row { display: flex; flex-wrap: wrap; gap: 3px 10px; align-items: center; }
  .legend i { display: inline-block; width: 16px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 3px; }
  .dot { width: 13px; height: 13px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff; font-size: 8px; font-weight: 700; font-style: normal; vertical-align: -2px; margin-right: 3px; }
  .legend i.dot { width: 13px; height: 13px; border-radius: 50%; }

  .side { display: grid; grid-template-rows: minmax(0, 1fr); min-height: 0; }
  .side .panel { display: grid; align-content: start; gap: 12px; overflow: auto; }
  .intro h2 { font-size: 21px; }
  .intro ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: 13.5px; }
  .intro li { display: flex; gap: 8px; align-items: baseline; }
  .intro li::before { content: ""; width: 6px; height: 6px; border-radius: 2px; background: var(--accent); flex: none; transform: translateY(-2px); }
  .howto { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; font-size: 13.5px; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); }
  .howto b { font-family: var(--display); color: var(--accent); }
  .sources { font-size: 11px; color: var(--muted); }
  .sources ul { margin: 2px 0 0; padding-left: 16px; }
  .demo-flag { display: inline-block; font-size: 11px; padding: 0 7px; border-radius: 4px; border: 1px dashed var(--muted); color: var(--muted); vertical-align: middle; font-weight: 400; font-family: var(--body); letter-spacing: 0; }

  .pv-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .pv-head h2 { font-size: 22px; }
  .pv-price { text-align: right; white-space: nowrap; }
  .pv-price strong { font-family: var(--display); font-size: 26px; font-weight: 900; }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .fact { padding: 8px 10px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); min-width: 0; }
  .fact .k { font-size: 11.5px; color: var(--muted); }
  .fact .v { font-family: var(--display); font-size: 17px; font-weight: 900; }
  .fact .s { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fact.good .v { color: var(--good); } .fact.warn .v { color: var(--warn); } .fact.bad .v { color: var(--bad); }
  .budget-line { font-size: 13px; padding: 6px 10px; border-radius: 8px; }
  .budget-line.ok { background: var(--accent-soft); } .budget-line.over { background: color-mix(in srgb, var(--bad) 14%, transparent); }
  @media (max-width: 860px) {
    .s-map { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; }
    .side .panel { max-height: 46vh; }
  }

  /* 地図の目印 */
  .leaflet-container { background: var(--map-ground); font-family: var(--body); }
  .price-pin { font-family: var(--display); font-weight: 900; font-size: 12.5px; padding: 2px 8px; border-radius: 999px; background: var(--surface); color: var(--ink); border: 2px solid var(--ink); white-space: nowrap; width: max-content; transform: translate(-50%, -50%); box-shadow: 0 2px 6px rgba(0,0,0,.18); cursor: pointer; }
  .price-pin.over { border-color: var(--muted); color: var(--muted); opacity: .8; }
  .price-pin.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); transform: translate(-50%, -50%) scale(1.25); }
  .pin { display: grid; place-items: center; border-radius: 50%; color: #fff; font-weight: 700; border: 2px solid var(--map-ground); box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .home-pin { width: 34px; height: 34px; border-radius: 50%; background: var(--mark); border: 3px solid var(--ink); display: grid; place-items: center; }

  .campus-pin { background: var(--accent); color: var(--on-accent); font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; white-space: nowrap; width: max-content; }
  .leaflet-tooltip.lbl { background: var(--surface); color: var(--ink); border: 1px solid var(--line); box-shadow: none; font-size: 12px; font-weight: 700; padding: 1px 6px; }

  .leaflet-control-attribution { font-size: 10px; background: color-mix(in srgb, var(--surface) 85%, transparent) !important; color: var(--muted); }
  .leaflet-control-attribution a { color: var(--accent); }

  /* 予算のポップオーバー */

  .pop input { text-align: right; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); padding: 6px 8px; width: 100%; }

  /* ---- 詳しい住宅情報の画面 ---- */
  .s-detail { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); grid-template-rows: auto minmax(0, 1fr); gap: 12px 16px; }

  .d-head .spec { color: var(--muted); font-size: 14px; }
  .d-head .pv-price { margin-left: auto; }
  .d-body { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }

  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .tab .v { margin-left: 5px; font-size: 11px; padding: 0 6px; border-radius: 999px; color: #fff; }
  .v-good { background: var(--good); } .v-warn { background: var(--warn); } .v-bad { background: var(--bad); }
  .tabbody { min-height: 0; overflow: auto; padding-top: 14px; display: grid; align-content: start; gap: 12px; }
  dl.rows { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 7px 14px; font-size: 14.5px; align-content: start; }
  dl.rows dt { color: var(--muted); white-space: nowrap; }
  dl.rows dd { margin: 0; }
  .note { font-size: 12.5px; color: var(--muted); }
  .big-verdict { font-family: var(--display); font-size: 24px; font-weight: 900; }
  .big-verdict.good { color: var(--good); } .big-verdict.warn { color: var(--warn); } .big-verdict.bad { color: var(--bad); }
  .meter { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .meter i { height: 10px; border-radius: 3px; background: var(--line); }
  .meter i.on { background: var(--warn); }
  .meter3 { display: inline-flex; gap: 3px; vertical-align: middle; margin-right: 4px; }
  .meter3 i { width: 18px; height: 9px; border-radius: 2px; background: var(--line); }
  .meter3 i.on { background: var(--accent); }
  .t-good { color: var(--good); } .t-warn { color: var(--warn); } .t-bad { color: var(--bad); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .money-bar { display: flex; height: 24px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
  .money-bar i { display: block; height: 100%; }
  .money-legend { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12px; color: var(--muted); }
  .money-legend b { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .checklist { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .checklist li { display: grid; grid-template-columns: 20px 1fr; gap: 6px; font-size: 13.5px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); line-height: 1.5; }
  .checklist input { width: 17px; height: 17px; margin-top: 2px; accent-color: var(--accent); }
  .checklist .why { display: block; font-size: 12px; color: var(--muted); }
  .pchecks { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .pcheck { padding: 7px 9px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font-size: 12px; min-width: 0; }
  .pcheck b { display: block; font-size: 14px; }
  .pcheck span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pcheck.good b { color: var(--good); } .pcheck.warn b { color: var(--warn); } .pcheck.bad b { color: var(--bad); }
  .letter { width: 100%; height: 230px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface-2); line-height: 1.75; resize: none; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .status { font-size: 13px; color: var(--muted); }
  @media (max-width: 860px) {
    .s-detail { grid-template-columns: 1fr; grid-template-rows: auto 180px minmax(0, 1fr); }
    .two, .checklist { grid-template-columns: 1fr; }
    .pchecks { grid-template-columns: repeat(3, 1fr); }
  }
</style>

      ヘヤカルテ
    </div>
    <div class="tagline">内見に行く前に、部屋の「まわり」まで分かる</div>
    <div class="spacer"></div>

      <button class="chip-btn" id="budgetBtn" aria-expanded="false">家賃の目安 <b class="num" id="budgetChip"></b> ✎</button>
      <div class="panel pop" id="budgetPop" hidden>
        <div class="eyebrow">毎月入ってくるお金</div>

        <label for="inAllow">仕送り<input id="inAllow" class="num" type="number" step="1000" min="0" value="30000"><span>円</span></label>

      </div>

<script>
(() => {
  "use strict";

  // ---------- 定数 ----------
  const LIVING = { utility: 10000, phone: 5000, food: 30000, daily: 15000, social: 10000 };
  const TRAFFIC_TEXT = {
    1: ["少ない", "細い生活道路。車はほとんど通らない想定"],
    2: ["少なめ", "生活道路。朝夕に通勤の車や自転車"],
    3: ["ふつう", "やや広い道路に近い。車の出入りがある"],
    4: ["多め", "主要な道路が近い。窓を開けると車の音が入りやすい"],
    5: ["多い", "幹線道路沿い。大型車も通り、音と排気ガスが気になりやすい"],
  };
  const POI_STYLE = {
    supermarket: { c: "#2f8a52", t: "ス", label: "スーパー" },
    convenience: { c: "#6b7f3a", t: "コ", label: "コンビニ" },
    chemist: { c: "#8a5ac0", t: "薬", label: "ドラッグストア" },
    clinic: { c: "#c0507a", t: "医", label: "診療所" },
    hospital: { c: "#bf3f2c", t: "病", label: "病院" },
    shelter: { c: "#2e6fb5", t: "避", label: "避難場所" },
  };
  // 地図に重ねる情報（ペルソナが気にしていること）
  const LAYERS = [
    { k: "shop", label: "スーパー・買い物", color: "#2f8a52", kinds: ["supermarket", "convenience", "chemist"] },
    { k: "med", label: "病院", color: "#bf3f2c", kinds: ["clinic", "hospital"] },
    { k: "traffic", label: "交通量", color: "#d9822b" },
    { k: "flood", label: "浸水想定", color: "#3f8fd6" },
    { k: "shelter", label: "避難場所", color: "#2e6fb5", kinds: ["shelter"] },
    { k: "heat", label: "ヒートマップ", color: "#2f9e5b" },
  ];
  // ヒートマップのテーマ。色が緑に近いほどその観点で住みやすい場所
  const HEAT_THEMES = [
    { k: "all", label: "総合" }, { k: "shop", label: "買い物" }, { k: "med", label: "病院" },
    { k: "quiet", label: "静かさ" }, { k: "commute", label: "通学" }, { k: "safety", label: "浸水しにくさ" },
  ];
  const HEAT_CELL = 80;
  const HEAT_STOPS = [[0, [210, 60, 42]], [0.5, [242, 201, 76]], [1, [47, 158, 91]]];
  // 建物の構造ごとの特徴（一般的な傾向。同じ構造でも建物ごとに差がある）
  // sound / fire は 1〜3（3が強い）
  const STRUCTURES = {
    "木造": { full: "木造", sound: 1, fire: 1, soundText: "隣や上の階の足音・話し声が聞こえやすい", fireText: "燃えやすい素材。火災保険や避難経路の確認を", note: "家賃が安め。風通しがよく湿気がこもりにくい一方、冬は寒くなりやすい" },
    "軽量鉄骨造": { full: "軽量鉄骨造", sound: 1, fire: 2, soundText: "壁が薄いことが多く、生活音は木造と同じくらい響く", fireText: "木造よりは燃えにくい", note: "アパートに多い構造。家賃は木造と同じくらい" },
    "鉄骨造": { full: "鉄骨造（重量鉄骨）", sound: 2, fire: 2, soundText: "床や壁がしっかりしていて、木造より音が伝わりにくい", fireText: "燃えにくい", note: "中くらいのマンションに多い" },
    "RC造": { full: "RC造（鉄筋コンクリート）", sound: 3, fire: 3, soundText: "壁が厚く、隣の生活音はほとんど気にならない", fireText: "燃えにくく、火事が広がりにくい", note: "家賃は高め。気密性が高く、冬の結露やカビには換気で対策を" },
    "SRC造": { full: "SRC造（鉄骨鉄筋コンクリート）", sound: 3, fire: 3, soundText: "壁が厚く、隣の生活音はほとんど気にならない", fireText: "燃えにくく、火事が広がりにくい", note: "高層マンションに多い、いちばん頑丈な構造" },
  };
  const LEVEL3 = ["", "弱い", "ふつう", "強い"];
  const TRAFFIC_COLORS = { 5: "#d23c2a", 4: "#e8892c", 3: "#e7c33a" };
  const ATTRIBUTION = '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors・国土地理院・J-SHIS';

  // ---------- 状態 ----------
  const state = {
    data: null, screen: "map", selected: null, tab: "building",
    layers: new Set(["heat"]), heatTheme: "all",
    sample: null,
  };
  const maps = { big: null, mini: null };
  const layerGroups = {};
  let heatLayer = null, heatCache = null;

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const yen = (n) => Math.round(n).toLocaleString("ja-JP") + "円";
  const man = (n) => (n / 10000).toFixed(n % 10000 ? 1 : 0) + "万円";
  const manShort = (n) => (n / 10000).toFixed(1).replace(/\.0$/, "") + "万";
  const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const byId = (id) => state.data.properties.find((x) => x.id === id);
  const ll = (x, y) => [y, x];

  function income() {
    const v = (id) => Math.max(0, Number($(id).value) || 0);
    return { scholar: v("inScholar"), allow: v("inAllow"), job: v("inJob") };
  }
  const incomeTotal = () => Object.values(income()).reduce((a, b) => a + b, 0);
  const rentCap = () => Math.floor(incomeTotal() / 3 / 1000) * 1000;
  const overBudget = (p) => p.rent + p.fee > rentCap();

  // ---------- 判定 ----------
  function lifeGrade(p) { const n = p.near; const m = Math.max(n.supermarket.min, Math.min(n.clinic.min, n.hospital.min)); return m <= 5 ? ["good", "安心"] : m <= 10 ? ["warn", "ふつう"] : ["bad", "遠い"]; }
  function trafficGrade(p) { const l = p.traffic.level; return [l <= 2 ? "good" : l <= 3 ? "warn" : "bad", TRAFFIC_TEXT[l][0]]; }
  function hazardGrade(p) {
    const h = p.hazard;
    if (h.landslide || h.tsunami || (h.flood >= 2 && p.floor === 1) || h.flood >= 3) return ["bad", "要確認"];
    if (h.flood >= 1 || h.nearFlood >= 1 || p.near.shelter.min > 10) return ["warn", "注意"];
    return ["good", "安心"];
  }
  // 築年数から、どの耐震基準で建てられたかを推定する（建築確認の時期と建った年はずれることがある）
  function quakeStandard(p) {
    const built = new Date().getFullYear() - p.age;
    if (built < 1982) return ["bad", "旧耐震基準の可能性", `${built}年ごろの建築。1981年5月以前に建築確認を受けた建物は、今の基準より地震に弱い`];
    if (p.structure === "木造" && built < 2001) return ["warn", "新耐震基準（木造の2000年基準の前）", `${built}年ごろの建築。木造は2000年に接合部などの基準が強化された`];
    return ["good", "新耐震基準", `${built}年ごろの建築。1981年6月以降の基準${p.structure === "木造" ? "（木造の2000年基準も満たす時期）" : ""}`];
  }
  function buildingGrade(p) {
    const st = STRUCTURES[p.structure], q = quakeStandard(p)[0];
    if (q === "bad") return ["bad", "要確認"];
    return st.sound >= 3 && q === "good" ? ["good", "頑丈"] : st.sound >= 2 ? ["good", "ふつう"] : ["warn", "音に注意"];
  }
  function floodShort(p) {
    const h = p.hazard;
    if (h.flood) return `浸水 ${h.floodLabel}`;
    return h.nearFlood ? `すぐ近くに浸水想定 ${h.nearFloodLabel}` : "浸水想定なし";
  }
  function moneyLeft(p) { return incomeTotal() - (p.rent + p.fee + LIVING.food + LIVING.utility + LIVING.phone + (p.net ? 0 : 4000) + LIVING.daily + LIVING.social); }
  function moneyGrade(p) { const l = moneyLeft(p); return l >= 10000 ? ["good", "OK"] : l >= 0 ? ["warn", "ギリギリ"] : ["bad", "赤字"]; }

  function initialCost(p) {
    const items = [
      ["敷金", p.rent * p.deposit], ["礼金", p.rent * p.key], ["仲介手数料", p.rent * 1.1],
      ["前家賃", p.rent + p.fee], ["保証会社", (p.rent + p.fee) * 0.5], ["火災保険", 15000], ["鍵の交換", 15000],
    ].filter(([, v]) => v > 0);
    return { items, total: items.reduce((a, [, v]) => a + v, 0) };
  }

  // ---------- 画面の移動 ----------
  function go(screen, id, { push = true } = {}) {
    if (screen === "detail" && !(id && byId(id))) screen = "map";
    state.screen = screen;
    if (id) state.selected = id;
    document.querySelectorAll(".screen").forEach((el) => { el.hidden = el.dataset.screen !== screen; });
    $("backBtn").hidden = screen !== "detail";
    $("logo").hidden = screen === "detail";
    const hash = screen === "detail" ? "home-" + id : "map";
    if (push && location.hash.slice(1) !== hash) { try { history.pushState(null, "", "#" + hash); } catch { /* 表示先によっては履歴を触れない */ } }
    if (screen === "map") { renderBigMap(); renderSide(); }
    else renderDetail();
  }
  function routeFromHash() {
    const h = location.hash.slice(1);
    if (h.startsWith("home-")) go("detail", h.slice(5), { push: false });
    else go("map", null, { push: false });
  }

  // ---------- 地図の共通部品 ----------
  function newMap(el) {
    const map = L.map(el, { crs: L.CRS.Simple, minZoom: -3.5, maxZoom: 1.5, zoomSnap: 0.25, zoomDelta: 0.5 });
    map.attributionControl.setPrefix(false).addAttribution(ATTRIBUTION);
    drawBase(map);
    return map;
  }

  function drawBase(map) {
    const d = state.data, renderer = L.canvas({ padding: 0.5 });
    const road = cssVar("--map-road"), rail = cssVar("--map-rail"), ground = cssVar("--map-ground");
    for (const w of d.map.ways) {
      const pts = [];
      for (let i = 0; i < w.p.length; i += 2) pts.push(ll(w.p[i], w.p[i + 1]));
      if (w.k === "rail") {
        L.polyline(pts, { renderer, color: rail, weight: 5, interactive: false }).addTo(map);
        L.polyline(pts, { renderer, color: ground, weight: 2.5, dashArray: "8 8", interactive: false }).addTo(map);
      } else {
        L.polyline(pts, { renderer, color: road, weight: [1.5, 1.5, 2, 3, 5, 7][w.r], interactive: false, lineCap: "round" }).addTo(map);
      }
    }
    for (const s of d.stations) {
      L.marker(ll(s.x, s.y), { icon: L.divIcon({ className: "", html: `<div class="st-pin">${esc(s.line)} ${esc(s.name)}</div>`, iconSize: null, iconAnchor: [0, 10] }), interactive: false }).addTo(map);
    }
    const g = d.campus.gates[0];
    L.marker(ll(g[0], g[1]), { icon: L.divIcon({ className: "", html: `<div class="campus-pin">近大キャンパス</div>`, iconSize: null, iconAnchor: [50, 12] }), interactive: false, zIndexOffset: 100 }).addTo(map);
  }

  function poiMarker(q, big = false) {
    const st = POI_STYLE[q.k], sz = big ? 24 : 17;
    const m = L.marker(ll(q.x, q.y), { icon: L.divIcon({ className: "", html: `<div class="pin" style="width:${sz}px;height:${sz}px;background:${st.c};font-size:${big ? 12 : 9}px">${st.t}</div>`, iconSize: [sz, sz], iconAnchor: [sz / 2, sz / 2] }), zIndexOffset: big ? 500 : 0 });
    m.bindTooltip(esc(q.n || st.label) + (q.e ? "（夜間救急）" : ""), { direction: "right", className: "lbl", offset: [8, 0], permanent: big });
    return m;
  }

  // 重ねる情報（交通量・浸水想定）の線や面を、指定した地図に描く
  function drawTraffic(target) {
    const renderer = L.canvas({ padding: 0.5 });
    for (const w of state.data.map.ways) {
      if (w.k === "rail" || w.r < 3) continue;
      const pts = [];
      for (let i = 0; i < w.p.length; i += 2) pts.push(ll(w.p[i], w.p[i + 1]));
      L.polyline(pts, { renderer, color: TRAFFIC_COLORS[Math.min(5, w.r)], weight: [0, 0, 0, 4, 7, 9][w.r], opacity: 0.9, interactive: false, lineCap: "round" }).addTo(target);
    }
  }
  function drawFlood(target) {
    // 同じ段階が横に続くマスは1つの長方形にまとめて描く
    const fg = state.data.hazard.flood, renderer = L.canvas({ padding: 0.5 });
    const colors = { 1: cssVar("--flood-1"), 2: cssVar("--flood-2"), 3: cssVar("--flood-3") };
    const rows = new Map();
    for (const [i, j, v] of fg.cells) { if (!rows.has(j)) rows.set(j, []); rows.get(j).push([i, Math.min(3, v)]); }
    for (const [j, arr] of rows) {
      arr.sort((a, b) => a[0] - b[0]);
      let start = null, prev = null;
      const flush = () => {
        if (!start) return;
        const x0 = fg.x0 + start[0] * fg.cell, x1 = fg.x0 + (prev[0] + 1) * fg.cell, y0 = fg.y0 + j * fg.cell;
        L.rectangle([ll(x0, y0), ll(x1, y0 + fg.cell)], { renderer, stroke: false, fillColor: colors[start[1]], fillOpacity: 0.42, interactive: false }).addTo(target);
      };
      for (const cur of arr) {
        if (start && cur[0] === prev[0] + 1 && cur[1] === start[1]) { prev = cur; continue; }
        flush(); start = cur; prev = cur;
      }
      flush();
    }
  }

  // ---------- ヒートマップ ----------
  // 地図全体を80m四方のマスに区切り、マスごとに観点別の住みやすさ（0〜1）を計算する。
  // 小さな画像にして地図に重ね、ブラウザの拡大補間でなめらかに見せる。
  function heatField() {
    if (heatCache) return heatCache;
    const d = state.data, [ex0, ey0, ex1, ey1] = d.map.extent, C = HEAT_CELL;
    const cols = Math.ceil((ex1 - ex0) / C), rows = Math.ceil((ey1 - ey0) / C);
    const pts = (kinds) => d.map.pois.filter((q) => kinds.includes(q.k)).map((q) => [q.x, q.y]);
    const segs = (pred) => {
      const out = [];
      for (const w of d.map.ways) if (pred(w)) for (let i = 0; i + 3 < w.p.length; i += 2) out.push([w.p[i], w.p[i + 1], w.p[i + 2], w.p[i + 3]]);
      return out;
    };
    const supers = pts(["supermarket"]), convs = pts(["convenience"]), clinics = pts(["clinic"]), hosps = pts(["hospital"]);
    const big = segs((w) => w.k !== "rail" && w.r >= 4), mid = segs((w) => w.k !== "rail" && w.r === 3), rail = segs((w) => w.k === "rail");
    const gates = d.campus.gates;
    const fl = d.hazard.flood, fcells = new Map(fl.cells.map(([i, j, v]) => [i + "," + j, v]));
    const near = (x, y, arr) => { let m = Infinity; for (const [a, b] of arr) m = Math.min(m, (a - x) ** 2 + (b - y) ** 2); return Math.sqrt(m); };
    const segD = (x, y, arr) => {
      let m = Infinity;
      for (const [ax, ay, bx, by] of arr) {
        const dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy;
        const t = L2 ? Math.max(0, Math.min(1, ((x - ax) * dx + (y - ay) * dy) / L2)) : 0;
        m = Math.min(m, (x - ax - t * dx) ** 2 + (y - ay - t * dy) ** 2);
      }
      return Math.sqrt(m);
    };
    const lin = (dist, good, bad) => Math.max(0, Math.min(1, (bad - dist) / (bad - good)));
    const field = {}; for (const t of HEAT_THEMES) field[t.k] = new Float32Array(cols * rows);
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      const x = ex0 + (i + 0.5) * C, y = ey0 + (j + 0.5) * C, k = j * cols + i;
      const shop = lin(near(x, y, supers), 150, 900) * 0.8 + lin(near(x, y, convs), 100, 500) * 0.2;
      const med = lin(near(x, y, clinics), 150, 800) * 0.6 + lin(near(x, y, hosps), 300, 1500) * 0.4;
      const quiet = Math.min(1, Math.max(0, (segD(x, y, big) - 20) / 200)) * 0.7 + Math.min(1, Math.max(0, (segD(x, y, mid) - 10) / 100)) * 0.2 + Math.min(1, Math.max(0, (segD(x, y, rail) - 20) / 150)) * 0.1;
      const commute = lin(near(x, y, gates), 300, 2500);
      const fi = Math.floor((x - fl.x0) / fl.cell), fj = Math.floor((y - fl.y0) / fl.cell);
      const safety = [1, 0.75, 0.4, 0.1, 0.05, 0, 0][fcells.get(fi + "," + fj) || 0];
      field.shop[k] = shop; field.med[k] = med; field.quiet[k] = quiet; field.commute[k] = commute; field.safety[k] = safety;
      field.all[k] = (shop + med + quiet + commute + safety) / 5;
    }
    // エリアの中で比べやすいよう、テーマごとに下位5%〜上位5%を0〜1に広げる
    for (const t of HEAT_THEMES) {
      const a = field[t.k], sorted = Array.from(a).sort((x, y) => x - y);
      const lo = sorted[Math.floor(sorted.length * 0.05)], hi = sorted[Math.floor(sorted.length * 0.95)];
      for (let n = 0; n < a.length; n++) a[n] = hi > lo ? Math.max(0, Math.min(1, (a[n] - lo) / (hi - lo))) : a[n];
    }
    heatCache = { field, cols, rows, x0: ex0, y0: ey0 };
    return heatCache;
  }

  function heatColor(v) {
    for (let i = 1; i < HEAT_STOPS.length; i++) {
      const [p1, c1] = HEAT_STOPS[i], [p0, c0] = HEAT_STOPS[i - 1];
      if (v <= p1) { const t = (v - p0) / (p1 - p0); return c0.map((c, n) => Math.round(c + (c1[n] - c) * t)); }
    }
    return HEAT_STOPS[HEAT_STOPS.length - 1][1];
  }

  function drawHeat() {
    if (!heatLayer) return;
    heatLayer.clearLayers();
    const { field, cols, rows, x0, y0 } = heatField(), vals = field[state.heatTheme];
    const cv = document.createElement("canvas"); cv.width = cols; cv.height = rows;
    const ctx = cv.getContext("2d"), img = ctx.createImageData(cols, rows);
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      const v = vals[j * cols + i], [r, g, b] = heatColor(v), o = ((rows - 1 - j) * cols + i) * 4;
      img.data[o] = r; img.data[o + 1] = g; img.data[o + 2] = b; img.data[o + 3] = 170;
    }
    ctx.putImageData(img, 0, 0);
    L.imageOverlay(cv.toDataURL(), [ll(x0, y0), ll(x0 + cols * HEAT_CELL, y0 + rows * HEAT_CELL)], { opacity: 0.72, interactive: false, className: "heat-img" }).addTo(heatLayer);
  }

  function heatAt(x, y, theme = "all") {
    const { field, cols, rows, x0, y0 } = heatField();
    const i = Math.floor((x - x0) / HEAT_CELL), j = Math.floor((y - y0) / HEAT_CELL);
    if (i < 0 || j < 0 || i >= cols || j >= rows) return null;
    return field[theme][j * cols + i];
  }

  // ---------- 大きい地図 ----------
  function buildLayers() {
    for (const ly of LAYERS) {
      const g = L.layerGroup();
      if (ly.kinds) for (const q of state.data.map.pois) if (ly.kinds.includes(q.k)) poiMarker(q).addTo(g);
      if (ly.k === "traffic") drawTraffic(g);
      if (ly.k === "flood") drawFlood(g);
      if (ly.k === "heat") heatLayer = g;
      layerGroups[ly.k] = g;
    }
  }

  function renderBigMap() {
    if (!window.L) { $("bigMap").innerHTML = `<p style="padding:16px" class="muted">地図ライブラリを読み込めませんでした。通信状況を確かめて、ページを開き直してください。</p>`; return; }
    if (!maps.big) {
      maps.big = newMap($("bigMap"));
      buildLayers();
      maps.big.pins = L.layerGroup().addTo(maps.big);
      maps.big.focus = L.layerGroup().addTo(maps.big);
      const ext = state.data.map.extent;
      maps.big.fitBounds([ll(ext[0] + 400, ext[1] + 400), ll(ext[2] - 400, ext[3] - 400)]);
      maps.big.on("click", () => { if (state.selected) { state.selected = null; renderSide(); drawPins(); } });
    }
    maps.big.invalidateSize();
    for (const ly of LAYERS) {
      const g = layerGroups[ly.k];
      if (state.layers.has(ly.k)) g.addTo(maps.big); else g.remove();
    }
    if (state.layers.has("heat")) drawHeat();
    maps.big.pins.remove().addTo(maps.big); // 札をいつもいちばん上に
    renderLayerChips();
    drawPins();
  }

  function drawPins() {
    const map = maps.big;
    if (!map) return;
    map.pins.clearLayers();
    map.focus.clearLayers();
    for (const p of state.data.properties) {
      const on = p.id === state.selected, cls = on ? "on" : overBudget(p) ? "over" : "";
      const m = L.marker(ll(p.x, p.y), { icon: L.divIcon({ className: "", html: `<div class="price-pin ${cls}">${manShort(p.rent + p.fee)}</div>`, iconSize: [0, 0] }), zIndexOffset: on ? 3000 : overBudget(p) ? 1000 : 2000, title: p.name, keyboard: true });
      m.on("click", (e) => { L.DomEvent.stopPropagation(e); selectPin(p.id); });
      m.addTo(map.pins);
    }
    const p = state.selected && byId(state.selected);
    if (p) {
      const accent = cssVar("--accent");
      for (const [min, fill] of [[10, 0], [5, 0.08]]) {
        const r = min * 80 / 1.3;
        L.circle(ll(p.x, p.y), { radius: r, color: accent, weight: 2, dashArray: "6 8", fillColor: accent, fillOpacity: fill, interactive: false }).addTo(map.focus);
      }
    }
  }

  function selectPin(id) {
    if (state.selected === id) { go("detail", id); return; }

    drawPins();
    renderSide();

  }

    if (maps.mini) { maps.mini.remove(); maps.mini = null; }
    const map = newMap(el);

        <dt>夜間の救急</dt><dd>${(n.emergency.m / 1000).toFixed(1)}km　${esc(n.emergency.name)}</dd>
      </dl>
      <p class="note">徒歩の分数は、直線距離×1.3を80m/分で割った目安です。</p>`;
    if (tab === "traffic") {
      const [label, desc] = TRAFFIC_TEXT[tr.level];
      return `
      <div><div class="eyebrow">家のまわりの車の量</div><div class="big-verdict ${trafficGrade(p)[0]}">${label}</div></div>
      <div class="meter" aria-hidden="true">${[1, 2, 3, 4, 5].map((i) => `<i class="${i <= tr.level ? "on" : ""}"></i>`).join("")}</div>
      <p>${desc}</p>
      <dl class="rows num">
        <dt>家の前の道</dt><dd>${esc(tr.front)}${tr.frontName ? `（${esc(tr.frontName)}）` : ""}</dd>
        <dt>120m以内の大きな道</dt><dd>${tr.bigRoads.length ? tr.bigRoads.map(esc).join("、") : "なし"}</dd>
        <dt>線路まで</dt><dd>約${tr.railM}m</dd>
        <dt>夜も開いている店</dt><dd>300m以内にコンビニ ${tr.conv300}軒</dd>
      </dl>
      <p class="note">道路の種類（OpenStreetMap）から推定した目安で、実際に測った交通量ではありません。左の地図は車の多い道路を色で示しています。</p>`;
    }
    if (tab === "hazard") {
      const g = hazardGrade(p);
      return `
      <div><div class="eyebrow">災害のリスク</div><div class="big-verdict ${g[0]}">${g[1]}</div></div>
      <p>${h.flood ? `大雨で川があふれたとき、${h.floodLabel}浸水する想定の地域です。部屋は${p.floor}階です。` : h.nearFlood ? `建物の場所は浸水想定の外ですが、すぐ近く（50m以内）に${h.nearFloodLabel}浸水する想定の区域があります。` : "洪水で浸水する想定のない地域です。"}避難場所は「${esc(n.shelter.name)}」、歩いて${n.shelter.min}分です。</p>
      <dl class="rows num">
        <dt>洪水の浸水想定</dt><dd>建物の場所 ${esc(h.floodLabel)}／すぐ近く ${esc(h.nearFloodLabel)}</dd>
        <dt>土砂災害</dt><dd>${h.landslide ? "警戒区域に入る" : "警戒区域の外"}</dd>
        <dt>津波</dt><dd>${h.tsunami ? "浸水想定あり" : "浸水想定なし"}</dd>
        <dt>大きな地震</dt><dd>30年以内に震度6弱以上 ${h.quake60}%（5強以上 ${h.quake55}%）</dd>
        <dt>避難場所</dt><dd>徒歩${n.shelter.min}分　${esc(n.shelter.name)}</dd>
      </dl>
      <p class="note">浸水は国の「想定最大規模」の雨が前提。左の地図の青いところが浸水想定の区域です。<a href="https://disaportal.gsi.go.jp/" target="_blank" rel="noopener">重ねるハザードマップ</a>でも確かめられます。</p>`;
    }
    if (tab === "money") {
      const spend = [
        ["家賃・管理費", p.rent + p.fee, "var(--accent)"], ["食費", LIVING.food, "#2f8a52"], ["光熱費", LIVING.utility, "#c47a16"],
        ["スマホ・ネット", LIVING.phone + (p.net ? 0 : 4000), "#8a5ac0"], ["日用品・交際費", LIVING.daily + LIVING.social, "#6d7a74"],
      ];
      const spendT = spend.reduce((a, [, v]) => a + v, 0), left = incT - spendT, scale = Math.max(incT, spendT), ic = initialCost(p);
      return `
      <div><div class="eyebrow">毎月</div><div class="big-verdict ${moneyGrade(p)[0]} num">${left >= 0 ? "残り " + yen(left) : yen(-left) + " 足りない"}</div></div>
      <div class="money-bar">${spend.map(([k, v, c]) => `<i title="${k} ${yen(v)}" style="width:${(v / scale) * 100}%;background:${c}"></i>`).join("")}</div>
      <div class="money-legend num">${spend.map(([k, v, c]) => `<span><b style="background:${c}"></b>${k} ${yen(v)}</span>`).join("")}</div>
      <p class="note num">入ってくるお金 ${yen(incT)}（奨学金 ${yen(inc.scholar)}・仕送り ${yen(inc.allow)}・バイト ${yen(inc.job)}）。右上の「家賃の目安」から変えられます。</p>
      <div class="two">
        <div><div class="eyebrow">入居前に必要</div><div class="big-verdict num">${yen(Math.round(ic.total / 100) * 100)}</div></div>
        <dl class="rows num small">${ic.items.map(([k, v]) => `<dt>${k}</dt><dd>${yen(Math.round(v / 100) * 100)}</dd>`).join("")}</dl>
      </div>
      <p class="note">奨学金は入学後に振り込まれるので、入居前のお金は先に用意が必要です。${inc.scholar ? `貸与型なら4年間で約${man(inc.scholar * 48)}を卒業後に返します。` : ""}</p>`;
    }
    if (tab === "check") {
      const c = checklist(p);
      return `
      <p class="small muted">内見に行かなくても、オンライン内見（ビデオ通話）で不動産会社にこれだけ聞けばOK。この部屋の条件から${c.length}個に絞りました。</p>
      <ul class="checklist">${c.map(([q, why], i) => `<li><input type="checkbox" id="ck-${p.id}-${i}"><label for="ck-${p.id}-${i}">${esc(q)}<span class="why">${esc(why)}</span></label></li>`).join("")}</ul>`;
    }
    return `
      <div class="pchecks">${parentChecks(p).map(([k, c, v, sub]) => `<div class="pcheck ${c}"><span class="muted">${k}</span><b class="num">${esc(v)}</b><span class="muted">${esc(sub)}</span></div>`).join("")}</div>
      <label for="letter" class="small muted">親に送るメッセージ（LINEにそのまま貼れます）</label>
      <textarea class="letter" id="letter"></textarea>
      <div class="row">
        <button class="btn" id="letterBtn">親に送る文章を作る</button>
        <button class="btn ghost" id="copyBtn">コピー</button>
        <button class="btn ghost" id="stopBtn" hidden>止める</button>
        <span class="status" id="letterStatus"></span>
      </div>`;
  }

  function checklist(p) {
    const c = [];
    if (p.floor === 1) c.push(["1階の防犯：窓に面格子や補助錠があるか", "1階は空き巣・のぞきの被害が多い。親が一番気にするポイント"]);
    if (p.hazard.nearFlood && p.floor <= 2) c.push(["過去にこの建物やまわりの道が浸水したことがあるか", p.hazard.flood ? `洪水の浸水想定 ${p.hazard.floodLabel} の区域` : `すぐ近くに浸水想定 ${p.hazard.nearFloodLabel} の区域`]);
    if (p.traffic.level >= 4) c.push(["窓を閉めたときの車の音（動画で送ってもらう）", `${p.traffic.bigRoads.join("・") || "大きな道路"}が近い`]);
    if (p.traffic.railM < 150) c.push(["電車が通るときの音と揺れ", `線路まで約${p.traffic.railM}m`]);
    if (STRUCTURES[p.structure].sound === 1) c.push(["隣や上の階の音がどれくらい聞こえるか（壁をたたいてもらう）", `${p.structure}は生活音が響きやすい`]);
    if (quakeStandard(p)[0] !== "good") c.push(["耐震診断や補強をしているか", quakeStandard(p)[1]]);
    if (p.age >= 30) c.push(["水回りのカビ・においと、給湯器の年式", `築${p.age}年。古い給湯器は冬に壊れやすい`]);
    if (!p.autolock) c.push(["玄関の鍵の種類（ディンプルキーか）", "オートロックなし"]);
    if (!p.net) c.push(["ネット回線を自分で引く必要があるか", "無料Wi-Fiなし。工事に数週間かかることがある"]);
    if (p.near.supermarket.min >= 8) c.push(["ネットスーパーの配達エリアか", `一番近いスーパーまで徒歩${p.near.supermarket.min}分`]);
    c.push(["部屋で携帯の電波が入るか", "ビデオ通話中にそのまま確かめられる"]);
    c.push(["日当たり（何時ごろまで日が入るか）", "写真では分かりにくい"]);
    return c;
  }

  function parentChecks(p) {
    const cap = rentCap(), m = p.rent + p.fee, ic = initialCost(p).total, n = p.near, h = p.hazard;
    return [
      ["毎月の家賃", m <= cap ? "good" : m <= cap * 1.15 ? "warn" : "bad", m <= cap ? "払える" : "きつい", `目安 ${man(cap)}`],
      ["初期費用", ic <= 150000 ? "good" : ic <= 220000 ? "warn" : "bad", man(Math.round(ic / 1000) * 1000), "入居前に必要"],
      ["防犯", p.autolock && p.floor >= 2 ? "good" : p.floor === 1 ? "bad" : "warn", p.autolock ? "オートロック" : p.floor === 1 ? "1階" : `${p.floor}階`, p.autolock ? "" : "オートロックなし"],
      ["災害", hazardGrade(p)[0], h.flood ? `浸水${h.floodLabel}` : h.nearFlood ? "近くに浸水想定" : "浸水想定なし", `避難場所 ${n.shelter.min}分`],
      ["病院", n.hospital.min <= 8 ? "good" : "warn", `徒歩${n.hospital.min}分`, n.hospital.name],
    ];
  }

  // ---------- 親へのメッセージ ----------
  function letterTemplate(p) {
    const n = p.near, h = p.hazard, ic = initialCost(p);
    return `お母さん、お父さんへ
部屋の候補が決まってきたので見てほしい。

【${p.name}】${p.layout}・${p.size}㎡・${p.structure}・${p.floor}階（${quakeStandard(p)[1]}）
・家賃 ${yen(p.rent)}＋管理費 ${yen(p.fee)}（毎月の予算 ${yen(rentCap())} 以内${p.rent + p.fee <= rentCap() ? "に収まる" : "を少し超える"}）
・入居前に約${man(Math.round(ic.total / 1000) * 1000)}かかる。奨学金は入学後に振り込まれるから、ここだけ先に助けてほしい
・大学まで歩いて${p.campus.min}分、スーパーは${n.supermarket.min}分、病院（${n.hospital.name}）は${n.hospital.min}分
・${h.flood ? `洪水のときは${h.floodLabel}浸水する想定の地域` : h.nearFlood ? `建物の場所は浸水想定の外（すぐ近くに${h.nearFloodLabel}の区域あり）` : "洪水の浸水想定はない地域"}。避難場所は${n.shelter.name}（歩いて${n.shelter.min}分）
・${p.autolock ? "オートロックあり" : "オートロックはない"}${p.floor === 1 ? "。1階なので防犯は不動産屋さんに確認する" : ""}

大丈夫そうなら、オンライン内見を申し込もうと思ってる。`;
  }

  function letterPrompt(p) {
    const n = p.near, h = p.hazard, ic = initialCost(p), inc = income();
    const facts = {
      物件: `${p.name}（${p.layout}・${p.size}㎡・${STRUCTURES[p.structure].full}・${quakeStandard(p)[1]}・築${p.age}年・${p.floor}階／${p.floors}階建て・オートロック${p.autolock ? "あり" : "なし"}）`,
      家賃: `${p.rent}円＋管理費${p.fee}円、敷金${p.deposit}か月・礼金${p.key}か月`,
      入居前に必要な費用: `約${Math.round(ic.total)}円`,
      本人の毎月の収入: `奨学金${inc.scholar}円・仕送り${inc.allow}円・バイト${inc.job}円、家賃予算の目安${rentCap()}円`,
      通学: `大学まで徒歩${p.campus.min}分`,
      暮らし: `スーパー徒歩${n.supermarket.min}分、診療所${n.clinic.min}分、病院「${n.hospital.name}」${n.hospital.min}分、夜間救急「${n.emergency.name}」${(n.emergency.m / 1000).toFixed(1)}km`,
      交通量: `${TRAFFIC_TEXT[p.traffic.level][0]}（${p.traffic.front}${p.traffic.bigRoads.length ? "、近くに" + p.traffic.bigRoads.join("・") : ""}）`,
      災害: `洪水の浸水想定 建物の場所${h.floodLabel}・50m以内${h.nearFloodLabel}、土砂災害警戒区域${h.landslide ? "内" : "外"}、30年以内に震度6弱以上の確率${h.quake60}%、避難場所「${n.shelter.name}」徒歩${n.shelter.min}分`,
    };
    return `大阪の大学に進学して一人暮らしをする新入生が、実家の親にLINEで送るメッセージを書いてください。
目的：この部屋に決めてよいか親に相談し、入居前の費用の援助をお願いすること。
親が気にするのは「毎月払えるか」「初期費用」「防犯」「災害」「病院」です。下の事実だけを使い、数字は変えないでください。書いていない事実は足さないでください。
口調：子から親への、ていねいすぎない普段の話し言葉。250〜350字。見出しや記号の多用はせず、LINEで読みやすく改行する。心配されそうな点は隠さず、どう確認するつもりかを一言添える。

${Object.entries(facts).map(([k, v]) => `- ${k}: ${v}`).join("\n")}

メッセージ本文だけを出力してください。`;
  }

  let letterCtl = null;
  async function makeLetter() {
    const p = byId(state.selected);
    if (!state.sample) { $("letter").value = letterTemplate(p); $("letterStatus").textContent = "ひな形に戻しました"; return; }
    letterCtl = new AbortController();
    $("letterBtn").disabled = true; $("stopBtn").hidden = false;
    $("letterStatus").textContent = "考えています…";
    try {
      await state.sample(letterPrompt(p), {
        signal: letterCtl.signal, cache: false,
        onText: ({ text }) => { if ($("letter")) $("letter").value = text; if ($("letterStatus")) $("letterStatus").textContent = "書いています…"; },
      });
      if ($("letterStatus")) $("letterStatus").textContent = "できました。気になるところは直してから送ってください";
    } catch (e) {
      if (!$("letter")) return;
      if (e?.text) $("letter").value = e.text;
      $("letterStatus").textContent = e?.code === "cancelled" ? "止めました" : errorText(e);
      if (FATAL.includes(e?.code)) disableAI();
    } finally {
      if ($("letterBtn")) { $("letterBtn").disabled = false; $("stopBtn").hidden = true; }
    }
  }

  const FATAL = ["not_granted", "sampling_disabled", "capability_disabled", "not_declared", "capability_removed"];
  function errorText(e) {
    return {
      rate_limited: "AIが混み合っています。少し待ってからもう一度どうぞ",
      not_granted: "AIの利用が許可されなかったので、ひな形を使ってください",
      refused: "この内容はAIが扱えませんでした",
      session_expired: "サインインし直してください",
    }[e?.code] || "AIがうまく動きませんでした。ひな形を使ってください";
  }
  function disableAI() {
    state.sample = null;
    $("aiState").textContent = "AIなし（ひな形で動作）";
    $("aiState").classList.remove("on");
    if ($("letterBtn")) $("letterBtn").textContent = "ひな形に戻す";
  }

  // ---------- イベント ----------
  function bind() {
    $("backBtn").addEventListener("click", () => go("map"));
    window.addEventListener("popstate", routeFromHash);
    $("layers").addEventListener("click", (e) => {
      const b = e.target.closest(".layer");
      const ht = e.target.closest(".ht");
      if (ht) { state.heatTheme = ht.dataset.t; state.layers.add("heat"); renderBigMap(); return; }
      if (!b) return;
      const k = b.dataset.k;
      state.layers.has(k) ? state.layers.delete(k) : state.layers.add(k);
      renderBigMap();
    });
    $("sidePanel").addEventListener("click", (e) => { if (e.target.id === "openDetail") go("detail", state.selected); });
    $("budgetBtn").addEventListener("click", () => {
      const open = $("budgetPop").hidden;
      $("budgetPop").hidden = !open; $("budgetBtn").setAttribute("aria-expanded", String(open));
    });
    document.addEventListener("click", (e) => {
      if (!$("budgetPop").hidden && !e.target.closest("#budgetPop, #budgetBtn")) { $("budgetPop").hidden = true; $("budgetBtn").setAttribute("aria-expanded", "false"); }
    });
    for (const id of ["inScholar", "inAllow", "inJob"]) $(id).addEventListener("input", () => {
      $("budgetChip").textContent = man(rentCap());
      if (state.screen === "map") { drawPins(); renderSide(); } else renderDetail();
    });
    $("tabs").addEventListener("click", (e) => {
      const t = e.target.closest(".tab"); if (!t) return;
      state.tab = t.dataset.tab; renderDetail();
    });
    $("tabBody").addEventListener("click", async (e) => {
      if (e.target.id === "letterBtn") makeLetter();
      if (e.target.id === "stopBtn") letterCtl?.abort();
      if (e.target.id === "copyBtn") {
        const ta = $("letter");
        try { await navigator.clipboard.writeText(ta.value); $("letterStatus").textContent = "コピーしました"; }
        catch { ta.focus(); ta.select(); $("letterStatus").textContent = "選択しました。コピーして貼り付けてください"; }
      }
    });
    window.addEventListener("resize", () => { maps.big?.invalidateSize(); maps.mini?.invalidateSize(); });
  }

  // ---------- 起動 ----------
  async function start() {
    bind();
    try {
      state.data = await (await fetch("data/area.json", { cache: "no-cache" })).json();
    } catch {
      document.querySelector(".stage").innerHTML = `<div class="panel" style="margin-top:20px">周辺データ（data/area.json）を読み込めませんでした。ファイルを直接開いている場合は、ローカルサーバー経由で開いてください。</div>`;
      return;
    }
    $("budgetChip").textContent = man(rentCap());
    routeFromHash();
    try { state.sample = window.claude ? await window.claude.use("sample") : null; } catch { state.sample = null; }
    if (state.sample) {
      $("aiState").textContent = "AI 使用可"; $("aiState").classList.add("on");
      if ($("letterBtn")) $("letterBtn").textContent = "AIで文章を整える";
    } else disableAI();
  }
  start();
})();
</script>
