server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;

    gzip on;
    gzip_types application/json text/css application/javascript;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    # 周辺データは作り直すことがあるので、毎回新しいか確かめさせる
    location /data/ {
        add_header Cache-Control "no-cache";
    }
}
