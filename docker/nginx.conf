server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;

    # セキュリティヘッダー（Vercel 版の next.config.ts・proxy.ts と同じ考え方。この版は index.html の中のスクリプトを使うので、
    # スクリプトの制限はかけず、埋め込み・プラグイン・base の書き換えだけを CSP で止める）
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    server_tokens off;

    gzip on;
    gzip_types application/json text/css application/javascript;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
        # location の中で add_header を書くと、上の server の add_header が引き継がれないので同じものを並べる
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # 周辺データは作り直すことがあるので、毎回新しいか確かめさせる
    location /data/ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
